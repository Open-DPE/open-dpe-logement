$id: https://schemas.open-dpe.fr/enveloppe/mur
$schema: https://json-schema.org/draft/2020-12/schema
title: Mur
type: object
unevaluatedProperties: false
properties:
  id:
    $ref: /common#/$defs/id
  description:
    $ref: /common#/$defs/description
  structures:
    title: Structures connues et justifiées
    type: array
    items:
      $ref: "#/$defs/structure"
  type_doublage:
    title: Type de doublage
    type: [string, "null"]
    x-enum: enveloppe:mur:type-doublage
    enum:
      - sans_doublage
      - indetermine
      - lame_air_inferieur_15mm
      - lame_air_superieur_15mm
      - materiaux_connu
      - null
  presence_enduit_isolant:
    title: Présence d'un enduit isolant
    type: [boolean, "null"]
  inertie:
    $ref: /enveloppe/paroi#/$defs/inertie
  annee_construction:
    $ref: /common#/$defs/annee_construction
  annee_renovation:
    $ref: /common#/$defs/annee_renovation
  u0:
    title: Coefficient de transmission thermique du mur nu connu et justifié en W/m².K
    oneOf:
      - $ref: /common#/$defs/nombre_positif
      - const: null
  u:
    title: Coefficient de transmission thermique du mur connu et justifié en W/m².K
    oneOf:
      - $ref: /common#/$defs/nombre_positif
      - const: null
  position:
    $ref: "#/$defs/position"
  isolation:
    $ref: /enveloppe/paroi#/$defs/isolation
  data:
    $ref: "#/$defs/data"

required:
  - id
  - description
  - structures
  - type_doublage
  - presence_enduit_isolant
  - inertie
  - annee_construction
  - annee_renovation
  - u0
  - u
  - position
  - isolation

$defs:
  structure:
    title: Structure
    type: object
    additionalProperties: false
    properties:
      materiau:
        title: Matériau
        type: [string, "null"]
        x-enum: enveloppe:mur:type
        enum:
          - pierre_moellons
          - pierre_moellons_avec_remplissage
          - pise_ou_beton_terre
          - pan_bois_sans_remplissage
          - pan_bois_avec_remplissage
          - bois_rondin
          - brique_pleine_simple
          - brique_pleine_double_avec_lame_air
          - brique_creuse
          - bloc_beton_plein
          - bloc_beton_creux
          - beton_banche
          - beton_machefer
          - brique_terre_cuite_alveolaire
          - sandwich_beton_isolant_beton_sans_isolation_rapportee
          - cloison_platre
          - ossature_bois_sans_remplissage
          - ossature_bois_avec_remplissage_tout_venant
          - ossature_bois_avec_remplissage_isolant
          - beton_cellulaire
          - null
      epaisseur:
        title: Epaisseur du mur non isolé en mm
        oneOf:
          - $ref: /common#/$defs/nombre_positif
          - const: null
      materiau_ancien:
        title: Matériau ancien
        type: [boolean, "null"]
    required:
      - materiau
      - epaisseur
      - materiau_ancien

  position:
    title: Position
    type: object
    properties:
      orientation:
        $ref: /enveloppe/paroi#/$defs/orientation
    required:
      - orientation
    allOf:
      - $ref: /enveloppe/paroi#/$defs/position

  data:
    title: Données calculées
    type: object
    readOnly: true
    additionalProperties: false
    properties:
      sdep:
        title: Surface déperditive du mur en m²
        type: number
      b:
        title: Coefficient de réduction des déperditions thermiques du mur
        type: number
      dp:
        title: Déperditions thermiques du mur en W/K
        type: number
      u:
        title: Coefficient de transmission thermique du mur en W/(m².K)
        type: number
      u0:
        title: Coefficient de transmission thermique du mur sans isolation en W/(m².K)
        type: number
      paroi_ancienne:
        title: Mur composé de matériaux anciens
        type: boolean
    required: [sdep, b, dp, u, u0, paroi_ancienne]
