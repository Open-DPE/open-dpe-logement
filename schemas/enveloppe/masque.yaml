$id: https://schemas.open-dpe.fr/enveloppe/masque
$schema: https://json-schema.org/draft/2020-12/schema
title: Masque
type: object
unevaluatedProperties: false
properties:
  description:
    $ref: /common#/$defs/description
  type:
    title: Type du masque
    type: string
    x-enum: enveloppe:masque:type
    enum:
      - homogene
      - non_homogene
      - fond_balcon
      - fond_et_flanc_loggias
      - balcon_ou_auvent
      - paroi_laterale_sans_obstacle_au_sud
      - paroi_laterale_avec_obstacle_au_sud
  hauteur:
    title: Hauteur du masque en angle
    oneOf:
      - $ref: /common#/$defs/nombre_positif
      - const: null
    exclusiveMaximum: 90
  profondeur:
    title: Profondeur du masque en m
    oneOf:
      - $ref: /common#/$defs/nombre_positif
      - const: null
  secteur:
    title: Secteur
    type: [string, "null"]
    x-enum: enveloppe:masque:secteur
    enum: [lateral, lateral_sud, central, central_sud, null]
required:
  - description
  - type
  - hauteur
  - profondeur
  - secteur

oneOf:
  - title: Masque lointain homogène
    type: object
    properties:
      type:
        const: homogene
      hauteur:
        type: integer
      profondeur:
        $ref: "/common#/$defs/non_applicable"
      secteur:
        $ref: "/common#/$defs/non_applicable"
    required:
      - type
      - hauteur
      - profondeur
      - secteur

  - title: Masque lointain non homogène
    type: object
    properties:
      type:
        const: non_homogene
      hauteur:
        type: integer
      secteur:
        type: string
      profondeur:
        $ref: "/common#/$defs/non_applicable"
    required:
      - type
      - hauteur
      - secteur
      - profondeur

  - title: Masque proche - Paroi latérale
    type: object
    properties:
      type:
        enum:
          - paroi_laterale_sans_obstacle_au_sud
          - paroi_laterale_avec_obstacle_au_sud
      hauteur:
        $ref: "/common#/$defs/non_applicable"
      profondeur:
        $ref: "/common#/$defs/non_applicable"
      secteur:
        $ref: "/common#/$defs/non_applicable"
    required:
      - type
      - hauteur
      - profondeur
      - secteur

  - title: Masque proche - Baie en fond de balcon ou fond et flanc de loggias
    type: object
    properties:
      type:
        enum:
          - fond_balcon
          - fond_et_flanc_loggias
      profondeur:
        type: number
      hauteur:
        $ref: "/common#/$defs/non_applicable"
      secteur:
        $ref: "/common#/$defs/non_applicable"
    required:
      - type
      - profondeur
      - hauteur
      - secteur

  - title: Masque proche - Baie sous un balcon ou auvent
    type: object
    properties:
      type:
        const: balcon_ou_auvent
      profondeur:
        type: number
      hauteur:
        $ref: "/common#/$defs/non_applicable"
      secteur:
        $ref: "/common#/$defs/non_applicable"
    required:
      - type
      - profondeur
      - hauteur
      - secteur
