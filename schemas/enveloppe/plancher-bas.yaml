$id: https://schemas.open-dpe.fr/enveloppe/plancher-bas
$schema: https://json-schema.org/draft/2020-12/schema
title: Plancher bas
type: object
unevaluatedProperties: false
properties:
  id:
    $ref: /common#/$defs/id
  description:
    $ref: /common#/$defs/description
  type:
    title: Type de plancher bas
    type: [string, "null"]
    x-enum: enveloppe:plancher-bas:type
    enum:
      - plancher_avec_ou_sans_remplissage
      - plancher_entre_solives_metalliques
      - plancher_entre_solives_bois
      - plancher_bois_sur_solives_metalliques
      - bardeaux_et_remplissage
      - voutains_sur_solives_metalliques
      - voutains_briques_ou_moellons
      - dalle_beton
      - plancher_bois_sur_solives_bois
      - plancher_lourd_type_entrevous_terre_cuite_ou_poutrelles_beton
      - plancher_entrevous_isolant
      - null
  inertie:
    $ref: /enveloppe/paroi#/$defs/inertie
  annee_construction:
    $ref: /common#/$defs/annee_construction
  annee_renovation:
    $ref: /common#/$defs/annee_renovation
  u0:
    title: Coefficient de transmission thermique du plancher bas nu connu et justifié en W/m².K
    oneOf:
      - $ref: /common#/$defs/nombre_positif
      - const: null
  u:
    title: Coefficient de transmission thermique du plancher bas connu et justifié en W/m².K
    oneOf:
      - $ref: /common#/$defs/nombre_positif
      - const: null
  position:
    $ref: "#/$defs/position"
  isolation:
    $ref: /enveloppe/paroi#/$defs/isolation
  data:
    $ref: "#/$defs/data"

required:
  - id
  - description
  - type
  - inertie
  - annee_construction
  - annee_renovation
  - u0
  - u
  - position
  - isolation

$defs:
  position:
    title: Position
    type: object
    properties:
      surface_ue:
        title: Surface retenue pour le calcul de ue en m²
        oneOf:
          - $ref: /common#/$defs/nombre_positif
          - const: null
      perimetre_ue:
        title: Périmètre retenue pour le calcul de ue en m
        oneOf:
          - $ref: /common#/$defs/nombre_positif
          - const: null
    allOf:
      - $ref: /enveloppe/paroi#/$defs/position
    oneOf:
      - title: Plancher bas donnant sur un vides sanitaire, un sous-sol non chauffé ou un terre-plein
        type: object
        properties:
          mitoyennete:
            enum:
              - enterre
              - vide_sanitaire
              - terre_plein
              - sous_sol_non_chauffe
          surface_ue:
            type: number
          perimetre_ue:
            type: number
          local_non_chauffe_id:
            const: null
            default: null
        required:
          - mitoyennete
          - surface_ue
          - perimetre_ue
          - local_non_chauffe_id

      - title: Autres cas
        type: object
        properties:
          mitoyennete:
            enum:
              - exterieur
              - local_non_chauffe
              - local_non_residentiel
              - local_residentiel
              - local_non_accessible
          surface_ue:
            const: null
            default: null
          perimetre_ue:
            const: null
            default: null
        required:
          - mitoyennete
          - surface_ue
          - perimetre_ue

  data:
    title: Données calculées
    type: object
    readOnly: true
    additionalProperties: false
    properties:
      sdep:
        title: Surface déperditive du plancher bas en m²
        type: number
      b:
        title: Coefficient de réduction des déperditions thermiques du plancher bas
        type: number
      dp:
        title: Déperditions thermiques du plancher bas en W/K
        type: number
      u:
        title: Coefficient de transmission thermique du plancher bas en W/m².K
        type: number
      u0:
        title: Coefficient de transmission thermique du plancher bas sans isolation en W/m².K
        type: number
    required: [sdep, b, dp, u, u0]
