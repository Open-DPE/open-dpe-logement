$id: https://schemas.open-dpe.fr/chauffage/generateur-thermodynamique
$schema: https://json-schema.org/draft/2020-12/schema
title: Générateur thermodynamique
type: object
unevaluatedProperties: false

allOf:
  - $ref: /chauffage/generateur-base

properties:
  type:
    enum:
      - pac_air_air
      - pac_air_eau
      - pac_eau_eau
      - pac_eau_glycolee_eau
      - pac_geothermique
  energie:
    const: electricite
  position:
    type: object
    properties:
      reseau_chaleur_id:
        $ref: "/common#/$defs/non_applicable"
    required:
      - reseau_chaleur_id
required:
  - type
  - energie
  - position

oneOf:
  - title: Pompe à chaleur classique
    type: object
    properties:
      bienergie:
        $ref: "/common#/$defs/non_applicable"
      position:
        type: object
        properties:
          cascade:
            $ref: "/common#/$defs/non_applicable"
          position_chaudiere:
            $ref: "/common#/$defs/non_applicable"
        required:
          - position_chaudiere
          - cascade
      signaletique:
        type: object
        properties:
          label:
            $ref: "/common#/$defs/non_applicable"
          mode_combustion:
            $ref: "/common#/$defs/non_applicable"
          presence_ventouse:
            $ref: "/common#/$defs/non_applicable"
          presence_regulation:
            $ref: "/common#/$defs/non_applicable"
          pveilleuse:
            $ref: "/common#/$defs/non_applicable"
          qp0:
            $ref: "/common#/$defs/non_applicable"
          rpn:
            $ref: "/common#/$defs/non_applicable"
          rpint:
            $ref: "/common#/$defs/non_applicable"
          tfonc30:
            $ref: "/common#/$defs/non_applicable"
          tfonc100:
            $ref: "/common#/$defs/non_applicable"
        required:
          - label
          - mode_combustion
          - presence_ventouse
          - presence_regulation
          - pveilleuse
          - qp0
          - rpn
          - rpint
          - tfonc30
          - tfonc100
    required:
      - type
      - energie
      - bienergie
      - position
      - signaletique

  - title: Pompe à chaleur hybride
    properties:
      type:
        enum:
          - pac_air_eau
          - pac_eau_eau
          - pac_eau_glycolee_eau
          - pac_geothermique
      bienergie:
        x-enum: energie
        enum:
          - gaz_naturel
          - gpl
          - fioul
          - bois_buche
          - bois_plaquette
          - bois_granule
      signaletique:
        type: object
        properties:
          label:
            $ref: "/common#/$defs/non_applicable"
        required:
          - label
    required:
      - type
      - bienergie
      - signaletique
