$id: https://schemas.open-dpe.fr/chauffage/installation
$schema: https://json-schema.org/draft/2020-12/schema
title: Installation de chauffage
type: object
unevaluatedProperties: false
properties:
  id:
    $ref: /common#/$defs/id
  description:
    $ref: /common#/$defs/description
  surface:
    $ref: /common#/$defs/surface
  type:
    title: Type d'installation de chauffage
    type: string
    x-enum: chauffage:type
    enum: [central, divise]
  installation_collective:
    title: Installation collective
    type: boolean
  comptage_individuel:
    title: Comptage individuel
    type: [boolean, "null"]
  regulation_terminale:
    title: Présence d'une régulation par pièce
    type: [boolean, "null"]
  programmation:
    title: Programmation
    type: string
    x-enum: chauffage:type-programmation
    enum:
      - absent
      - central_sans_minimum_temperature
      - central_avec_minimum_temperature
      - central_collectif_sans_detection_presence
      - central_collectif_avec_detection_presence
      - terminal_avec_minimum_temperature
      - terminal_avec_minimum_temperature_detection_presence
  solaire_thermique:
    title: Solaire thermique
    type: ["object", "null"]
    unevaluatedProperties: false
    properties:
      usage:
        title: Usages couverts par le solaire thermique
        type: string
        x-enum: chauffage:usage-solaire
        enum:
          - chauffage
          - chauffage_ecs
      annee_installation:
        $ref: /common#/$defs/annee_installation
      fch:
        title: Facteur de couverture solaire
        oneOf:
          - $ref: /common#/$defs/nombre
          - const: null
        maximum: 1
    required:
      - usage
      - annee_installation
      - fch
  systemes:
    title: Liste des systèmes de chauffage
    type: array
    minItems: 1
    items:
      $ref: /chauffage/systeme
  data:
    $ref: "#/$defs/data"
required:
  - id
  - description
  - surface
  - type
  - installation_collective
  - programmation
  - solaire_thermique
  - systemes

oneOf:
  - title: Chauffage central collectif
    properties:
      type:
        const: central
      installation_collective:
        const: true
      comptage_individuel:
        type: boolean
      regulation_terminale:
        type: boolean
      programmation:
        enum:
          - absent
          - central_collectif_sans_detection_presence
          - central_collectif_avec_detection_presence
      systemes:
        contains:
          type: object
          properties:
            type:
              const: central
          required:
            - type
    required:
      - type
      - installation_collective
      - comptage_individuel
      - regulation_terminale
      - programmation
      - systemes

  - title: Chauffage central individuel
    properties:
      type:
        const: central
      installation_collective:
        const: false
      comptage_individuel:
        const: null
        default: null
      regulation_terminale:
        type: boolean
      programmation:
        enum:
          - absent
          - central_sans_minimum_temperature
          - central_avec_minimum_temperature
          - terminal_avec_minimum_temperature
          - terminal_avec_minimum_temperature_detection_presence
      systemes:
        contains:
          type: object
          properties:
            type:
              const: central
          required:
            - type
    required:
      - type
      - installation_collective
      - comptage_individuel
      - regulation_terminale
      - programmation
      - systemes

  - title: Chauffage divisé
    properties:
      type:
        const: divise
      installation_collective:
        const: false
      comptage_individuel:
        const: null
        default: null
      regulation_terminale:
        const: null
        default: null
      programmation:
        enum:
          - absent
          - central_sans_minimum_temperature
          - central_avec_minimum_temperature
          - terminal_avec_minimum_temperature
          - terminal_avec_minimum_temperature_detection_presence
      systemes:
        type: array
        items:
          type: object
          properties:
            type:
              const: divise
            reseau:
              const: null
              default: null
          required:
            - type
            - reseau
    required:
      - type
      - installation_collective
      - comptage_individuel
      - regulation_terminale
      - programmation
      - systemes

$defs:
  data:
    title: Données calculées
    type: object
    readOnly: true
    additionalProperties: false
    properties:
      bch:
        title: Besoins de chauffage de l'installation en kWh/an
        type: number
      rdim:
        title: Ratio de dimensionnement de l'installation de chauffage
        type: number
      pch:
        title: Puissance conventionnelle de l'installation de chauffage en kW
        type: number
      fch:
        title: Facteur de couverture solaire de l'installation de chauffage
        type: number
    required: [bch, rdim, pch, fch]
