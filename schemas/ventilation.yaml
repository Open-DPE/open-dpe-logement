$id: https://schemas.open-dpe.fr/ventilation
$schema: https://json-schema.org/draft/2020-12/schema
title: Ventilation
type: object
unevaluatedProperties: false
properties:
  installations:
    title: Liste des installations
    type: array
    minItems: 1
    items:
      $ref: /ventilation/installation
  data:
    $ref: "#/$defs/data"
required:
  - installations

$defs:
  data:
    title: Données calculées
    type: object
    readOnly: true
    additionalProperties: false
    properties:
      qvarep_conv:
        title: Débit volumique conventionnel à reprendre en m3/(h.m²)
        type: number
      qvasouf_conv:
        title: Débit volumique conventionnel à souffler en m3/(h.m²)
        type: number
      smea_conv:
        title: Somme des modules d'entrée d'air sous 20 Pa par unité de surface habitable en m3/(h.m²)
        type: number
    required: [qvarep_conv, qvasouf_conv, smea_conv]
