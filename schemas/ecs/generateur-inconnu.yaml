$id: https://schemas.open-dpe.fr/ecs/generateur-inconnu
$schema: https://json-schema.org/draft/2020-12/schema
title: Générateur collectif inconnu
type: object
additionalProperties: false

allOf:
  - $ref: /ecs/generateur-base

properties:
  type:
    const: null
  energie:
    const: null
  bienergie:
    $ref: "/common#/$defs/non_applicable"
  position:
    type: object
    properties:
      generateur_collectif:
        const: true
        default: true
      position_volume_chauffe:
        const: false
        default: false
      position_chauffe_eau:
        $ref: "/common#/$defs/non_applicable"
      generateur_mixte_id:
        $ref: "/common#/$defs/non_applicable"
      reseau_chaleur_id:
        $ref: "/common#/$defs/non_applicable"
    required:
      - generateur_collectif
      - position_volume_chauffe
      - position_chauffe_eau
      - generateur_mixte_id
      - reseau_chaleur_id
  signaletique:
    type: object
    properties:
      pn:
        $ref: "/common#/$defs/non_applicable"
      cop:
        $ref: "/common#/$defs/non_applicable"
      label:
        $ref: "/common#/$defs/non_applicable"
      mode_combustion:
        $ref: "/common#/$defs/non_applicable"
      presence_ventouse:
        $ref: "/common#/$defs/non_applicable"
      pveilleuse:
        $ref: "/common#/$defs/non_applicable"
      qp0:
        $ref: "/common#/$defs/non_applicable"
      rpn:
        $ref: "/common#/$defs/non_applicable"
    required:
      - pn
      - cop
      - label
      - mode_combustion
      - presence_ventouse
      - pveilleuse
      - qp0
      - rpn
required:
  - type
  - energie
  - position
  - signaletique
