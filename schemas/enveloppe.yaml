$id: https://schemas.open-dpe.fr/enveloppe
$schema: https://json-schema.org/draft/2020-12/schema
title: Enveloppe
type: object
additionalProperties: false
properties:
  exposition:
    title: Exposition
    type: string
    x-enum: enveloppe:exposition
    enum: [simple, multiple]
  q4pa_conv:
    title: Débit d'air conventionnel à 4 Pa en m³/h
    oneOf:
      - $ref: /common#/$defs/nombre_positif
      - const: null
  presence_brasseurs_air:
    title: Présence de brasseurs d'air
    type: boolean
  niveaux:
    title: Liste des niveaux
    type: array
    minItems: 1
    items:
      $ref: /enveloppe/niveau
  locaux_non_chauffes:
    title: Liste des locaux non chauffés
    type: array
    items:
      $ref: /enveloppe/local-non-chauffe
  murs:
    title: Liste des murs
    type: array
    items:
      $ref: /enveloppe/mur
  planchers_bas:
    title: Liste des planchers bas
    type: array
    items:
      $ref: /enveloppe/plancher-bas
  planchers_hauts:
    title: Liste des planchers hauts
    type: array
    items:
      $ref: /enveloppe/plancher-haut
  baies:
    title: Liste des baies
    type: array
    items:
      $ref: /enveloppe/baie
  portes:
    title: Liste des portes
    type: array
    items:
      $ref: /enveloppe/porte
  ponts_thermiques:
    title: Liste des ponts thermiques
    type: array
    items:
      $ref: /enveloppe/pont-thermique
  masques:
    title: Liste des masques
    type: array
    items:
      $ref: /enveloppe/masque
  data:
    $ref: "#/$defs/data"
required:
  - exposition
  - q4pa_conv
  - presence_brasseurs_air
  - niveaux
  - locaux_non_chauffes
  - murs
  - planchers_bas
  - planchers_hauts
  - baies
  - portes
  - ponts_thermiques
  - masques

$defs:
  data:
    title: Données calculées
    type: object
    readOnly: true
    additionalProperties: false
    properties:
      gv:
        title: Coefficient de déperditions globales en W/K
        type: number
      ubat:
        title: Coefficient de transmission surfacique moyen du bâtiment en W/(m².K)
        type: number
      dp:
        title: Déperditions par parois en W/K
        type: number
      dp_murs:
        title: Déperditions par les murs en W/K
        type: number
      dp_planchers_bas:
        title: Déperditions par les planchers bas en W/K
        type: number
      dp_planchers_hauts:
        title: Déperditions par les planchers hauts en W/K
        type: number
      dp_baies:
        title: Déperditions par les baies en W/K
        type: number
      dp_portes:
        title: Déperditions par les portes en W/K
        type: number
      pt:
        title: Déperditions thermiques par les ponts thermiques en W/K
        type: number
      dr:
        title: Déperditions thermiques par renouvellement d'air en W/K
        type: number
      sdep:
        title: Surface déperditive totale en m²
        type: number
      sdep_murs:
        title: Surface déperditive des murs en m²
        type: number
      sdep_planchers_bas:
        title: Surface déperditive des planchers bas en m²
        type: number
      sdep_planchers_hauts:
        title: Surface déperditive des planchers hauts en m²
        type: number
      sdep_baies:
        title: Surface déperditive des baies en m²
        type: number
      sdep_portes:
        title: Surface déperditive des portes en m²
        type: number
      inertie:
        title: Classe d'inertie thermique du bâtiment
        type: string
        x-enum: enveloppe:inertie
      hperm:
        title: Déperditions thermiques par renouvellement d'air due au vent en W/K
        type: number
      hvent:
        title: Déperditions thermiques par renouvellement d'air due aux systèmes de ventilation en W/K
        type: number
      q4pa_conv:
        title: Débit d'air conventionnel à 4 Pa en m³/h
        type: number
      presence_joints:
        title: Présence majoritaire de joints d'étanchéité au niveau des menuiseries extérieures
        type: boolean
      parois_anciennes:
        title: Présence majoritaire de parois composées de matériaux anciens
        type: boolean
      isolation_planchers_hauts:
        title: Isolation majoritaire des planchers hauts
        type: [boolean, "null"]
      presence_protection_solaire:
        title: Présence majoritaire de protections solaires
        type: boolean
      logement_traversant:
        title: Logement traversant
        type: boolean
      sse:
        title: Surface sud équivalente totale en m²
        type: number
    required:
      - gv
      - ubat
      - dp
      - dp_murs
      - dp_planchers_bas
      - dp_planchers_hauts
      - dp_baies
      - dp_portes
      - pt
      - dr
      - sdep
      - sdep_murs
      - sdep_planchers_bas
      - sdep_planchers_hauts
      - sdep_baies
      - sdep_portes
      - inertie
      - hperm
      - hvent
      - presence_joints
      - parois_anciennes
      - isolation_planchers_hauts
      - presence_protection_solaire
      - logement_traversant
      - sse
