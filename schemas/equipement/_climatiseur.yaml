$id: https://schemas.open-dpe.fr/equipement/climatiseur
$schema: https://json-schema.org/draft/2020-12/schema
title: Générateur de refroidissement
type: object
unevaluatedProperties: false

allOf:
  - $ref: /equipement/base

properties:
  usage:
    title: Usage
    type: array
    uniqueItems: true
    items:
      type: string
      x-enum: equipement:usage
      enum:
        - refroidissement
  type:
    title: Type de générateur
    type: string
    x-enum: equipement:type
    enum:
      - climatiseur
      - climatiseur_thermodynamique
  energie:
    title: Énergie utilisée par le générateur
    type: string
    x-enum: energie
    enum: [electricite, gaz_naturel, gpl]
  annee_installation:
    $ref: /common#/$defs/annee_installation
  seer:
    title: Coefficient d'efficience énergétique saisonnier
    oneOf:
      - $ref: /common#/$defs/nombre_positif
      - const: null
  data:
    $ref: "#/$defs/data"

required:
  - id
  - description
  - type
  - energie
  - annee_installation
  - seer

$defs:
  data:
    title: Données calculées
    type: object
    readOnly: true
    additionalProperties: false
    properties:
      consommations:
        title: Consommations par usage et par énergie du générateur de refroidissement
        $ref: /common#/$defs/consommations
      rdim:
        title: Ratio de dimensionnement du générateur de refroidissement
        type: number
      eer:
        title: Efficacité énergétique saisonnière (EER) du générateur de refroidissement
        type: number
    required: [consommations, rdim, eer]
