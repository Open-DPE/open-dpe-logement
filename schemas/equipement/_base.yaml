$id: https://schemas.open-dpe.fr/equipement/base
$schema: https://json-schema.org/draft/2020-12/schema
title: Template - Équipement
type: object
unevaluatedProperties: false
properties:
  id:
    $ref: /common#/$defs/id
  description:
    $ref: /common#/$defs/description
  usage:
    title: Usage
    type: array
    uniqueItems: true
    items:
      type: string
      x-enum: equipement:usage
      enum:
        - chauffage
        - ecs
        - refroidissement
        - ventilation
  type:
    title: Type d'équipement
    type: [string, "null"]
    x-enum: equipement:type
    enum:
      - chauffe_eau
      - cet_air_ambiant
      - cet_air_exterieur
      - cet_air_extrait
      - chaudiere
      - poele_bouilleur
      - pac_air_air
      - pac_air_eau
      - pac_eau_eau
      - pac_eau_glycolee_eau
      - pac_geothermique
      - reseau_urbain
      - climatiseur_thermodynamique
      - climatiseur
      - convecteur_bi_jonction
      - convecteur_electrique
      - panneau_rayonnant_electrique
      - plafond_rayonnant_electrique
      - plancher_rayonnant_electrique
      - radiateur_electrique
      - radiateur_electrique_accumulation
      - generateur_air_chaud
      - cuisiniere
      - foyer_ferme
      - insert
      - poele
      - radiateur_gaz
  energie:
    title: Energie
    type: [string, "null"]
    x-enum: energie
    enum:
      - electricite
      - gaz_naturel
      - gpl
      - fioul
      - charbon
      - bois_buche
      - bois_plaquette
      - bois_granule
      - reseau_urbain
      - null
  bienergie:
    title: Energie secondaire
    x-enum: energie
    type: [string, "null"]
    enum: [gaz_naturel, gpl, fioul, null]
  annee_installation:
    $ref: /common#/$defs/annee_installation
  signaletique:
    $ref: "#/$defs/signaletique"
  position:
    $ref: "#/$defs/position"
  data:
    $ref: "#/$defs/data"

required:
  - id
  - description
  - usage
  - type
  - energie
  - bienergie
  - annee_installation
  - signaletique
  - position

$defs:
  position:
    title: Position
    type: object
    unevaluatedProperties: false
    properties:
      position_chaudiere:
        title: Position de la chaudière
        type: [string, "null"]
        x-enum: chauffage:position-chaudiere
        enum: [chaudiere_murale, chaudiere_sol, null]
      cascade:
        title: Générateur en cascade
        description: >
          Ordre de priorité du générateur en cascade :
          - 0 : Absence de priorité
          - 1 : Générateur principal
          - 2 : Générateur secondaire
        type: [integer, "null"]
        enum: [0, 1, 2, null]
        default: null
      generateur_collectif:
        title: Générateur collectif d'eau chaude sanitaire
        type: boolean
      generateur_multi_batiment:
        title: Générateur multi bâtiment
        type: boolean
      position_volume_chauffe:
        title: Position du générateur à l'intérieur du volume chauffé
        type: boolean
      reseau_urbain_id:
        title: Identifiant du réseau urbain
        type: [string, "null"]
    required:
      - position_chaudiere
      - cascade
      - generateur_collectif
      - generateur_multi_batiment
      - position_volume_chauffe
      - reseau_urbain_id
    anyOf:
      - title: Générateur individuel
        type: object
        properties:
          generateur_collectif:
            const: false
          generateur_multi_batiment:
            const: false
        required:
          - generateur_collectif
          - generateur_multi_batiment
      - title: Générateur collectif
        type: object
        properties:
          generateur_collectif:
            const: true
          position_volume_chauffe:
            const: false
        required:
          - generateur_collectif
          - position_volume_chauffe

  signaletique:
    title: Fiche signalétique
    type: object
    unevaluatedProperties: false
    properties:
      pn:
        title: Puissance nominale en kW
        oneOf:
          - $ref: /common#/$defs/nombre_positif
          - const: null
      label:
        title: Label
        type: [string, "null"]
        enum:
          - flamme_verte
          - nf_performance
          - ne_performance_a
          - ne_performance_b
          - ne_performance_c
          - null
        x-enum: chauffage:label-generateur
      scop:
        title: Coefficient de performance énergétique saisonnier
        oneOf:
          - $ref: /common#/$defs/nombre_positif
          - const: null
      cop:
        title: Coefficient de performance énergétique
        oneOf:
          - $ref: /common#/$defs/nombre_positif
          - const: null
      mode_combustion:
        title: Mode de combustion
        type: [string, "null"]
        x-enum: chauffage:mode-combustion
        enum:
          - standard
          - basse_temperature
          - condensation
          - null
      presence_ventouse:
        title: Présence d'une ventouse
        type: [boolean, "null"]
      presence_regulation:
        title: Présence d'une régulation de combustion
        type: [boolean, "null"]
      pveilleuse:
        title: Puissance de la veilleuse en W
        oneOf:
          - $ref: /common#/$defs/nombre
          - const: null
      qp0:
        title: Pertes à l'arrêt en kW
        oneOf:
          - $ref: /common#/$defs/nombre_positif
          - const: null
      rpn:
        title: Rendement à puissance nominale sur PCI
        oneOf:
          - $ref: /common#/$defs/nombre_positif
          - const: null
      rpint:
        title: Rendement à puissance intermédiaire sur PCI
        oneOf:
          - $ref: /common#/$defs/nombre_positif
          - const: null
      tfonc30:
        title: Température de fonctionnement à 30% de la puissance nominale en °C
        oneOf:
          - $ref: /common#/$defs/nombre_positif
          - const: null
      tfonc100:
        title: Température de fonctionnement à 100% de la puissance nominale en °C
        oneOf:
          - $ref: /common#/$defs/nombre_positif
          - const: null
        seer:
          title: Coefficient d'efficience énergétique saisonnier de refroidissement
          oneOf:
            - $ref: /common#/$defs/nombre_positif
            - const: null
    required:
      - pn
      - label
      - scop
      - cop
      - mode_combustion
      - presence_ventouse
      - presence_regulation
      - pveilleuse
      - qp0
      - rpn
      - rpint
      - tfonc30
      - tfonc100
      - seer

  data:
    title: Données calculées
    type: object
    readOnly: true
    additionalProperties: false
    properties:
      consommations:
        title: Consommations par usage et par énergie
        $ref: /common#/$defs/consommations
      rdim:
        title: Ratio de dimensionnement
        type: number
      pn:
        title: Puissance nominale
        type: [number, "null"]
      paux:
        title: Puissance de l'auxiliaire
        type: [number, "null"]
      scop:
        title: Coefficient de performance énergétique saisonnier
        type: [number, "null"]
      cop:
        title: Coefficient de performance énergétique
        type: [number, "null"]
      qp0:
        title: Pertes à l'arrêt en kW
        type: [number, "null"]
      rpn:
        title: Rendement à pleine charge nominale
        type: [number, "null"]
      rpint:
        title: Rendement à pleine charge intermédiaire
        type: [number, "null"]
      pveilleuse:
        title: Puissance de la veilleuse en kW
        type: [number, "null"]
      tfonc30:
        title: Température de fonctionnement à 30% de charge en °C
        type: [number, "null"]
      tfonc100:
        title: Température de fonctionnement à 100% de charge en °C
        type: [number, "null"]
      cr:
        title: Coefficient de perte du ballon de stockage en Wh/(l.°C.jour)
        type: [number, "null"]
      qgw:
        title: Pertes de stockage en Wh/an
        type: [number, "null"]
      qgen:
        title: Pertes de génération en Wh/an
        type: [number, "null"]
      eer:
        title: Efficacité énergétique saisonnière (EER) de refroidissement
        type: [number, "null"]
    required:
      - consommations
      - rdim
      - pn
      - paux
      - scop
      - cop
      - qp0
      - rpn
      - rpint
      - pveilleuse
      - tfonc30
      - tfonc100
      - cr
      - qgw
      - qgen
      - eer
