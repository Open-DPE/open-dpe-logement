id: climat:sollicitations
name: sollicitations
fields:
  - name: zone_climatique
    title: Zone climatique
    type: string
    format: enums
    x-enum: zone-climatique
    required: true
  - name: altitude/gt
    title: Altitude (supérieure à)
    type: number
    required: false
  - name: altitude/gte
    title: Altitude (supérieure ou égale à)
    type: number
    required: false
  - name: altitude/lt
    title: Altitude (inférieure à)
    type: number
    required: false
  - name: altitude/lte
    title: Altitude (inférieure ou égale à)
    type: number
    required: false
  # Critère unique du §18.3 : le bâtiment doit être constitué majoritairement de
  # parois en matériaux anciens ET avoir une inertie lourde. Les deux conditions
  # sont indissociables (conjonction), d'où une colonne unique plutôt qu'un
  # couple `parois_anciennes` / `inertie` : toute autre combinaison relève du
  # cas général du §18.2 (valeur 0).
  - name: inertie_lourde_parois_anciennes
    title: Bâtiment à inertie lourde constitué de parois anciennes (§18.3)
    type: boolean
    required: true
  - name: mois
    title: Mois
    type: string
    format: enums
    x-enum: mois
    required: true
  - name: tefs
    title: Température moyenne d'eau froide sanitaire en °C
    type: number
    required: true
  - name: e
    title: Ensoleillement reçu en période de chauffage en kWh/m²
    type: number
    required: true
  - name: efr26
    title: Ensoleillement reçu en période de refroidissement pour une température de consigne de 26°C en kWh/m²
    type: number
    required: true
  - name: efr28
    title: Ensoleillement reçu en période de refroidissement pour une température de consigne de 28°C en kWh/m²
    type: number
    required: true
  - name: text
    title: Température extérieure moyenne en °C
    type: number
    required: false
  - name: textmoy26
    title: Température extérieure moyenne pour une température de consigne de 26°C en °C
    type: number
    required: false
  - name: textmoy28
    title: Température extérieure moyenne pour une température de consigne de 28°C en °C
    type: number
    required: false
  - name: nref19
    title: Nombre d'heures de chauffage pour une température de consigne à 19°C
    type: number
    required: true
  - name: nref21
    title: Nombre d'heures de chauffage pour une température de consigne à 21°C
    type: number
    required: true
  - name: nref26
    title: Nombre d'heures de refroidissement pour une température de consigne à 26°C
    type: number
    required: true
  - name: nref28
    title: Nombre d'heures de refroidissement pour une température de consigne à 28°C
    type: number
    required: true
  - name: dh14
    title: Degrés heures de base 14 sur la saison de chauffe complète
    type: number
    required: true
  - name: dh19
    title: Degrés-heure pour une température de consigne de 19°C
    type: number
    required: true
  - name: dh21
    title: Degrés-heure pour une température de consigne de 21°C
    type: number
    required: true
  - name: dh26
    title: Degrés-heure pour une température de consigne de 26°C
    type: number
    required: true
  - name: dh28
    title: Degrés-heure pour une température de consigne de 28°C
    type: number
    required: true
