refroidissement.installation.rdim:
  run: calcule_rdim
  cases:
    - title: Plusieurs installations
      with:
        sh: 200
        surface_installation: 100
        surface_installations: 200
      expect: 0.5

    - title: Installation partielle
      with:
        sh: 200
        surface_installation: 50
        surface_installations: 100
      expect: 0.25

    - title: Installation unique
      with:
        sh: 100
        surface_installation: 100
        surface_installations: 100
      expect: 1

    - title: Surface totale = 0
      with:
        sh: 100
        surface_installation: 100
        surface_installations: 0
      expect: 0

    - title: Surface installation = 0
      with:
        sh: 100
        surface_installation: 0
        surface_installations: 100
      expect: 0
