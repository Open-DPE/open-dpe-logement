chauffage.systeme.emission.type_emission:
  rule: type_emission
  cases:
    - title: Chaudière hydraulique sur plancher chauffant → émission par plancher chauffant
      with:
        type_generateur: chaudiere
        type_distribution: hydraulique
        type_emetteur: plancher_chauffant
      expect: plancher_chauffant

    - title: Chaudière hydraulique sur radiateurs bitube → émission par radiateur
      with:
        type_generateur: chaudiere
        type_distribution: hydraulique
        type_emetteur: radiateur_bitube
      expect: radiateur

    - title: PAC air/eau hydraulique sur radiateurs monotube → émission par radiateur
      with:
        type_generateur: pac_air_eau
        type_distribution: hydraulique
        type_emetteur: radiateur_monotube
      expect: radiateur

    - title: Émetteur non caractérisé sur distribution hydraulique → émission par radiateur
      with:
        type_generateur: chaudiere
        type_distribution: hydraulique
        type_emetteur: autres
      expect: radiateur

    - title: PAC air/air → émission par air soufflé
      with:
        type_generateur: pac_air_air
        type_distribution: null
        type_emetteur: null
      expect: air_souffle

    - title: Réseau de chaleur aéraulique → émission par air soufflé
      with:
        type_generateur: reseau_chaleur
        type_distribution: aeraulique
        type_emetteur: null
      expect: air_souffle

    - title: Convecteur électrique → émission par radiateur
      with:
        type_generateur: convecteur_electrique
        type_distribution: null
        type_emetteur: null
      expect: radiateur

    - title: Plafond rayonnant électrique → émission par plafond chauffant
      with:
        type_generateur: plafond_rayonnant_electrique
        type_distribution: null
        type_emetteur: null
      expect: plafond_chauffant

    - title: Plancher rayonnant électrique → émission par plancher chauffant
      with:
        type_generateur: plancher_rayonnant_electrique
        type_distribution: null
        type_emetteur: null
      expect: plancher_chauffant

    - title: Poêle → émission par radiateur
      with:
        type_generateur: poele
        type_distribution: null
        type_emetteur: null
      expect: radiateur

    - title: Type de générateur inconnu → erreur ValeurForfaitaire
      with:
        type_generateur: GENERATEUR_INCONNU
        type_distribution: null
        type_emetteur: null
      expectError: true
