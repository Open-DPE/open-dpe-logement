chauffage.systeme.emission.cch:
  rule: cch
  cases:
    - title: Générateur simple → seule la part principale est comptée
      with:
        cch1: 1200
        cch2: null
      expect: 1200

    - title: PAC hybride → somme des parts PAC et chaudière
      with:
        cch1: 960
        cch2: 240
      expect: 1200

chauffage.systeme.emission.cch1:
  rule: cch1
  cases:
    - title: Système unique, rendement unitaire, sans solaire → besoins annuels reportés
      with:
        zone_climatique: H1a
        pac_hybride: false
        fch: 0
        rdim_i: 1
        rdim: 1
        int: 1
        ich1: 1
        n: 1
        bch:
          &bch100
          "01": 100
          "02": 100
          "03": 100
          "04": 100
          "05": 100
          "06": 100
          "07": 100
          "08": 100
          "09": 100
          "10": 100
          "11": 100
          "12": 100
      expect: 1200

    - title: Couverture solaire de 25 % → besoins résiduels de 75 %
      with:
        zone_climatique: H1a
        pac_hybride: false
        fch: 0.25
        rdim_i: 1
        rdim: 1
        int: 1
        ich1: 1
        n: 1
        bch: *bch100
      expect: 900

    - title: Deux émissions rattachées au système → besoins répartis à parts égales
      with:
        zone_climatique: H1a
        pac_hybride: false
        fch: 0
        rdim_i: 1
        rdim: 1
        int: 1
        ich1: 1
        n: 2
        bch: *bch100
      expect: 600

    - title: Système couvrant la moitié de l'installation, elle-même sur la moitié du logement
      with:
        zone_climatique: H1a
        pac_hybride: false
        fch: 0
        rdim_i: 0.5
        rdim: 0.5
        int: 1
        ich1: 1
        n: 1
        bch: *bch100
      expect: 300

    - title: Intermittence et rendement pris en compte
      with:
        zone_climatique: H1a
        pac_hybride: false
        fch: 0
        rdim_i: 1
        rdim: 1
        int: 0.9
        ich1: 1.5
        n: 1
        bch: *bch100
      expect: 1620

    - title: PAC hybride en zone H1a → 80 % des besoins couverts par la PAC
      with:
        zone_climatique: H1a
        pac_hybride: true
        fch: 0
        rdim_i: 1
        rdim: 1
        int: 1
        ich1: 1
        n: 1
        bch: *bch100
      expect: 960

    - title: PAC hybride en zone H3 → 88 % des besoins couverts par la PAC
      with:
        zone_climatique: H3
        pac_hybride: true
        fch: 0
        rdim_i: 1
        rdim: 1
        int: 1
        ich1: 1
        n: 1
        bch: *bch100
      expect: 1056

chauffage.systeme.emission.cch2:
  rule: cch2
  cases:
    - title: PAC hybride en zone H1a → 20 % des besoins couverts par la chaudière
      with:
