    - title: PAC hybride en zone H2a → 17 % des besoins couverts par la chaudière
      with:
        zone_climatique: H2a
        pac_hybride: true
        fch: 0
        rdim_i: 1
        rdim: 1
        int: 1
        ich2: 1
