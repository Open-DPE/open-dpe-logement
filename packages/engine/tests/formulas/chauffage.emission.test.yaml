        bch: *bch100
      expect: 204

    - title: Générateur non hybride → aucun abattement appliqué
      with:
        zone_climatique: H1a
        pac_hybride: false
        fch: 0
        rdim_i: 1
        rdim: 1
        int: 1
        ich2: 1
        n: 1
        bch: *bch100
      expect: 1200

chauffage.systeme.emission.int:
  rule: int
  cases:
    - title: Coefficient volumique de déperdition inférieur à 1 → intermittence corrigée à la hausse
      with:
        gv: 100
        sh: 100
        hsp: 2.5
        i0: 0.9
      expect: 0.9574

    - title: Coefficient volumique égal à 1 → intermittence égale au coefficient de base
      with:
        gv: 250
        sh: 100
        hsp: 2.5
        i0: 0.9
      expect: 0.9

    - title: Coefficient volumique supérieur à 1 → intermittence corrigée à la baisse
      with:
        gv: 500
        sh: 100
        hsp: 2.5
        i0: 0.9
      expect: 0.8182

chauffage.systeme.emission.i0:
  rule: i0
  cases:
    - title: Maison, chauffage divisé, radiateurs, inertie légère, sans programmation → 0.84
      with:
        type_batiment: maison
        type_chauffage: divise
        type_emission: radiateur
        inertie: legere
        installation_collective: false
        comptage_individuel: null
        regulation_terminale: null
        type_programmation: absent
        type_generateur: convecteur_electrique
      expect: 0.84

    - title: Maison, chauffage divisé, plancher chauffant, inertie légère → 0.9
      with:
        type_batiment: maison
        type_chauffage: divise
        type_emission: plancher_chauffant
        inertie: legere
        installation_collective: false
        comptage_individuel: null
        regulation_terminale: null
        type_programmation: absent
        type_generateur: plancher_rayonnant_electrique
      expect: 0.9

    - title: Maison, inertie lourde → intermittence dégradée (0.86)
      with:
        type_batiment: maison
        type_chauffage: divise
        type_emission: radiateur
        inertie: lourde
        installation_collective: false
        comptage_individuel: null
        regulation_terminale: null
        type_programmation: absent
        type_generateur: convecteur_electrique
      expect: 0.86

    - title: Maison, chauffage central, régulation terminale présente → 0.88
      with:
        type_batiment: maison
        type_chauffage: central
        type_emission: radiateur
        inertie: moyenne
        installation_collective: false
        comptage_individuel: null
        regulation_terminale: true
        type_programmation: absent
        type_generateur: chaudiere
      expect: 0.88

    - title: Maison, chauffage central, sans régulation terminale → 0.91
      with:
        type_batiment: maison
        type_chauffage: central
        type_emission: radiateur
        inertie: moyenne
        installation_collective: false
        comptage_individuel: null
        regulation_terminale: false
        type_programmation: absent
        type_generateur: chaudiere
      expect: 0.91

    - title: Immeuble, chauffage divisé, radiateurs, sans programmation → 0.9
      with:
        type_batiment: immeuble
        type_chauffage: divise
        type_emission: radiateur
        inertie: legere
        installation_collective: false
        comptage_individuel: null
        regulation_terminale: null
        type_programmation: absent
        type_generateur: convecteur_electrique
      expect: 0.9

    - title: Immeuble, chauffage collectif avec comptage individuel et régulation → 0.95
      with:
        type_batiment: immeuble
        type_chauffage: central
        type_emission: radiateur
        inertie: legere
        installation_collective: true
        comptage_individuel: true
        regulation_terminale: true
        type_programmation: absent
        type_generateur: chaudiere
      expect: 0.95

    - title: Convecteur bi-jonction → moyenne pondérée 60 % collectif / 40 % individuel
      with:
        type_batiment: immeuble
        type_chauffage: central
        type_emission: radiateur
        inertie: legere
        installation_collective: false
        comptage_individuel: false
        regulation_terminale: false
        type_programmation: absent
        type_generateur: convecteur_bi_jonction
      expect: 1.014

    - title: Combinaison absente de l'abaque → erreur ValeurForfaitaire
      with:
        type_batiment: TYPE_INCONNU
        type_chauffage: divise
        type_emission: radiateur
        inertie: legere
        installation_collective: false
        comptage_individuel: null
        regulation_terminale: null
        type_programmation: absent
        type_generateur: convecteur_electrique
      expectError: true

chauffage.systeme.emission.ich1:
  rule: ich1
  cases:
    - title: Générateur à combustion → inverse du produit des rendements
      with:
        rd: 0.9
        rg: 0.8
        re: 0.95
        rr: 0.9
        scop: null
      expect: 1.6244

    - title: Pompe à chaleur → le SCOP remplace le rendement de génération
      with:
        rd: 0.9
        rg: 0.8
        re: 0.95
        rr: 0.9
        scop: 3
      expect: 0.4332

    - title: Rendements unitaires → inverse égal à 1
      with:
        rd: 1
        rg: 1
        re: 1
        rr: 1
        scop: null
      expect: 1

chauffage.systeme.emission.ich2:
  rule: ich2
  cases:
    - title: Partie chaudière d'une PAC hybride → inverse du produit des rendements
      with:
        rd: 0.9
        rg: 0.8
        re: 0.95
        rr: 0.9
      expect: 1.6244

    - title: Rendements unitaires → inverse égal à 1
      with:
        rd: 1
        rg: 1
        re: 1
        rr: 1
      expect: 1

chauffage.systeme.emission.ich:
  rule: ich
  cases:
    - title: Générateur simple (pas de seconde part) → ich1
      with:
        zone_climatique: H1a
        pac_hybride: false
        ich1: 1.6244
        ich2: null
      expect: 1.6244

    - title: Générateur non hybride avec une seconde part renseignée → ich1 seul
      with:
        zone_climatique: H1a
        pac_hybride: false
        ich1: 1
        ich2: 2
      expect: 1

    - title: PAC hybride en zone H1a → pondération 80 / 20
      with:
        zone_climatique: H1a
        pac_hybride: true
        ich1: 1
        ich2: 2
      expect: 1.2

    - title: PAC hybride en zone H3 → pondération 88 / 12
      with:
        zone_climatique: H3
        pac_hybride: true
        ich1: 1
        ich2: 2
      expect: 1.12

