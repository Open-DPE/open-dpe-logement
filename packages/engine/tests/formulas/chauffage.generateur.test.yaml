chauffage.generateur.qpx_chaudiere_combustion:
  rule: qpx_chaudiere_combustion
  cases:
    - title: Chaudière gaz standard 20 kW avec régulation
      with:
        pn: 20
        rpn: 0.85
        rpint: 0.8
        kpcs: 1.11
        mode_combustion: standard
        presence_regulation: true
        tfonc30: 52.5
        tfonc100: 70
      expect:
        qp30: 2.354
        qp100: 6.1177

    - title: Chaudière gaz standard 20 kW sans régulation → tfonc100 utilisé à 30 % de charge
      with:
        pn: 20
        rpn: 0.85
        rpint: 0.8
        kpcs: 1.11
        mode_combustion: standard
        presence_regulation: false
        tfonc30: 52.5
        tfonc100: 70
      expect:
        qp30: 2.5629
        qp100: 6.1177

chauffage.generateur.qpx_autres:
  rule: qpx_autres
  cases:
    - title: Chaudière bois 20 kW (PCI/PCS 1.08)
      with:
        pn: 20
        rpn: 0.85
        rpint: 0.8
        kpcs: 1.08
      expect:
        qp50: 3.5
        qp100: 5.4117

    - title: Rendements parfaits → aucune perte
      with:
        pn: 20
        rpn: 1
        rpint: 1
        kpcs: 1
      expect:
        qp50: 0
        qp100: 0

chauffage.generateur.type_generateur:
  rule: type_generateur
  cases:
    - title: Type de générateur saisi → retenu
      with:
        type_generateur: pac_air_eau
      expect: pac_air_eau

    - title: Type de générateur non saisi → chaudière par défaut
      with:
        type_generateur: null
      expect: chaudiere

chauffage.generateur.energie_generateur:
  rule: energie_generateur
  cases:
    - title: Énergie saisie → retenue
      with:
        energie_generateur: gaz_naturel
      expect: gaz_naturel

    - title: Énergie non saisie → fioul par défaut
      with:
        energie_generateur: null
      expect: fioul

chauffage.generateur.mode_combustion:
  rule: mode_combustion
  cases:
    - title: Mode de combustion saisi → retenu
      with:
        mode_combustion: condensation
      expect: condensation

    - title: Mode de combustion non saisi → standard par défaut
      with:
        mode_combustion: null
      expect: standard

chauffage.generateur.presence_ventouse:
  rule: presence_ventouse
  cases:
    - title: Présence saisie → retenue
      with:
        presence_ventouse: true
      expect: true

    - title: Présence non saisie → absence par défaut
      with:
        presence_ventouse: null
      expect: false

chauffage.generateur.presence_regulation:
  rule: presence_regulation
  cases:
    - title: Présence saisie → retenue
      with:
        presence_regulation: true
      expect: true

    - title: Présence non saisie → absence par défaut
      with:
        presence_regulation: null
      expect: false

chauffage.generateur.annee_installation:
  rule: annee_installation
  cases:
    - title: Année d'installation saisie → retenue
      with:
        annee_installation: 2015
        annee_construction_batiment: 1975
      expect: 2015

    - title: Année d'installation absente → année de construction du bâtiment
      with:
        annee_installation: null
        annee_construction_batiment: 1975
      expect: 1975

# Identifiants doctrinaux portés par la même implémentation que
# `chauffage.generateur.cef` / `chauffage.generateur.rpn`.
chauffage.generateur.cep:
  rule: consommations
  cases:
    - title: Énergie primaire de l'auxiliaire de génération (× 1.9)
      with:
