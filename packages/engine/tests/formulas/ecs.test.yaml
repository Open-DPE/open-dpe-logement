          &nj31
          "01": 31
          "02": 31
          "03": 31
          "04": 31
          "05": 31
          "06": 31
          "07": 31
          "08": 31
          "09": 31
          "10": 31
          "11": 31
          "12": 31
        sollicitations:
          &tefs78
          "01": { tefs: 7.8 }
          "02": { tefs: 7.8 }
          "03": { tefs: 7.8 }
          "04": { tefs: 7.8 }
          "05": { tefs: 7.8 }
          "06": { tefs: 7.8 }
          "07": { tefs: 7.8 }
          "08": { tefs: 7.8 }
          "09": { tefs: 7.8 }
