ecs.cep:
  rule: consommations
  cases:
    - title: Énergie primaire de l'ECS électrique (× 1.9)
      with:
        consommations:
          - ecs:
              electricite: { cef: 2000, cep: 3800, eges: 130 }
      expectPartial:
        ecs:
          electricite: { cep: 3800 }

ecs.eges:
  rule: consommations
  cases:
    - title: Émissions de l'ECS électrique
      with:
        consommations:
          - ecs:
              electricite: { cef: 2000, cep: 3800, eges: 130 }
      expectPartial:
        ecs:
          electricite: { eges: 130 }
