        type_isolation_plancher: null
        type_pose_menuiserie: nu_interieur
        presence_retour_isolation: false
        largeur_dormant: 50
      expect: 0.9

    - title: Type de liaison inconnu → erreur ValeurForfaitaire
      with:
        kpt_saisi: null
        type_liaison: LIAISON_INCONNUE
        isolation_mur: false
        type_isolation_mur: null
        isolation_plancher: null
        type_isolation_plancher: null
        type_pose_menuiserie: null
        presence_retour_isolation: null
        largeur_dormant: null
      expectError: true

enveloppe.pont_thermique.isolation_mur:
  rule: isolation_mur
  cases:
    - title: Isolation saisie → retenue
      with:
        isolation: false
        annee_construction: 2010
      expect: false

    - title: Isolation inconnue, construction en 1975 → isolé
      with:
        isolation: null
        annee_construction: 1975
      expect: true

    - title: Isolation inconnue, construction en 1974 → non isolé
      with:
        isolation: null
        annee_construction: 1974
      expect: false

enveloppe.pont_thermique.isolation_plancher_haut:
  rule: isolation_plancher_haut
  cases:
    - title: Isolation saisie → retenue
      with:
        isolation: true
        annee_construction: 1950
      expect: true

    - title: Isolation inconnue, construction en 1975 → isolé
      with:
        isolation: null
        annee_construction: 1975
      expect: true

    - title: Isolation inconnue, construction en 1974 → non isolé
      with:
        isolation: null
        annee_construction: 1974
      expect: false

enveloppe.pont_thermique.isolation_plancher_bas:
  rule: isolation_plancher_bas
  cases:
    - title: Isolation saisie → retenue
      with:
        mitoyennete: vide_sanitaire
        isolation: true
        annee_construction: 1950
      expect: true

    - title: Vide sanitaire, isolation inconnue, construction en 1975 → isolé
      with:
        mitoyennete: vide_sanitaire
        isolation: null
        annee_construction: 1975
      expect: true

    - title: Terre-plein, isolation inconnue, construction en 1975 → non isolé (seuil 2001)
      with:
        mitoyennete: terre_plein
        isolation: null
        annee_construction: 1975
      expect: false

    - title: Terre-plein, isolation inconnue, construction en 2001 → isolé
      with:
        mitoyennete: terre_plein
        isolation: null
        annee_construction: 2001
      expect: true

enveloppe.pont_thermique.type_isolation_mur:
  rule: type_isolation_mur
  cases:
    - title: Type d'isolation saisi → retenu
      with:
        type_isolation: ite
      expect: ite

    - title: Type d'isolation non saisi → ITI par défaut
      with:
        type_isolation: null
      expect: iti

enveloppe.pont_thermique.type_isolation_plancher_haut:
  rule: type_isolation_plancher_haut
  cases:
    - title: Type d'isolation saisi → retenu
      with:
        type_isolation: iti
      expect: iti

    - title: Type d'isolation non saisi → ITE par défaut
      with:
        type_isolation: null
      expect: ite

enveloppe.pont_thermique.type_isolation_plancher_bas:
  rule: type_isolation_plancher_bas
  cases:
    - title: Type d'isolation saisi → retenu
      with:
        type_isolation: iti
      expect: iti

    - title: Type d'isolation non saisi → ITE par défaut
      with:
        type_isolation: null
      expect: ite

enveloppe.pont_thermique.largeur_dormant:
  rule: largeur_dormant
  cases:
    - title: Largeur de dormant saisie → retenue
      with:
        largeur_dormant: 80
      expect: 80

    - title: Largeur de dormant non saisie → 50 mm par défaut
      with:
        largeur_dormant: null
      expect: 50

enveloppe.pont_thermique.presence_retour_isolation:
  rule: presence_retour_isolation
  cases:
    - title: Présence saisie → retenue
      with:
        presence_retour_isolation: true
      expect: true

    - title: Présence non saisie → absence par défaut
      with:
        presence_retour_isolation: null
      expect: false
