enveloppe.pont_thermique.pt:
  rule: pt
  cases:
    - title: Liaison plancher bas / mur → longueur × kpt (aucun abattement)
      with:
        type_liaison: plancher_bas_mur
        kpt: 0.39
        l: 10
        pont_thermique_partiel: false
      expect: 3.9

    - title: Liaison plancher haut / mur → longueur × kpt
      with:
        type_liaison: plancher_haut_mur
        kpt: 0.3
        l: 10
        pont_thermique_partiel: false
      expect: 3

    - title: Liaison baie / mur → longueur × kpt
      with:
        type_liaison: baie_mur
        kpt: 0.43
        l: 6
        pont_thermique_partiel: false
      expect: 2.58

    - title: Liaison refend / mur totale → longueur × kpt
      with:
        type_liaison: refend_mur
        kpt: 0.73
        l: 10
        pont_thermique_partiel: false
      expect: 7.3

    - title: Liaison refend / mur partielle → abattement de 50 %
      with:
        type_liaison: refend_mur
        kpt: 0.73
        l: 10
        pont_thermique_partiel: true
      expect: 3.65

    - title: Liaison plancher intermédiaire / mur partielle → abattement de 50 %
      with:
        type_liaison: plancher_intermediaire_mur
        kpt: 0.86
        l: 10
        pont_thermique_partiel: true
      expect: 4.3

    - title: L'abattement partiel ne s'applique pas aux liaisons plancher bas / mur
      with:
        type_liaison: plancher_bas_mur
        kpt: 0.39
        l: 10
        pont_thermique_partiel: true
      expect: 3.9

    - title: L'abattement partiel ne s'applique pas aux liaisons baie / mur
      with:
        type_liaison: baie_mur
        kpt: 0.43
        l: 6
        pont_thermique_partiel: true
      expect: 2.58

    - title: Longueur nulle → aucune déperdition
      with:
        type_liaison: refend_mur
        kpt: 0.73
        l: 0
        pont_thermique_partiel: false
      expect: 0

enveloppe.pont_thermique.kpt:
  rule: kpt
