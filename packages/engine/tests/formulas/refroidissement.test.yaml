refroidissement.cep:
  rule: consommations
  cases:
    - title: Énergie primaire du refroidissement électrique (× 1.9)
      with:
        consommations:
          - refroidissement:
              electricite: { cef: 500, cep: 950, eges: 32 }
      expectPartial:
        refroidissement:
          electricite: { cep: 950 }

refroidissement.eges:
  rule: consommations
  cases:
    - title: Émissions du refroidissement électrique
      with:
        consommations:
          - refroidissement:
              electricite: { cef: 500, cep: 950, eges: 32 }
      expectPartial:
        refroidissement:
          electricite: { eges: 32 }
