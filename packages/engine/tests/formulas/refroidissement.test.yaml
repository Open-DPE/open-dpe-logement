refroidissement.tint:
  rule: tint
  cases:
    - title: Scénario conventionnel → 28°C
      with:
        scenario: conventionnel
      expect: 28

    - title: Scénario dépensier → 26°C
      with:
        scenario: depensier
      expect: 26

refroidissement.cin:
  rule: cin
  cases:
    - title: Inertie légère (110 000 × sh)
      with:
        sh: 100
        inertie: legere
      expect: 11000000

    - title: Inertie moyenne (165 000 × sh)
      with:
        sh: 100
        inertie: moyenne
      expect: 16500000

    - title: Inertie lourde (260 000 × sh)
      with:
        sh: 100
        inertie: lourde
      expect: 26000000

    - title: Inertie très lourde (260 000 × sh)
      with:
        sh: 100
        inertie: tres_lourde
      expect: 26000000

refroidissement.t:
  rule: t
  cases:
    - title: Cas standard → cin / (3600 × gv)
      with:
        gv: 100
        cin: 360000
      expect: 1

    - title: GV nul → 0 (pas de division par zéro)
      with:
        gv: 0
        cin: 1000000
      expect: 0

refroidissement.cfr:
  rule: cfr
  cases:
    - title: Somme de plusieurs générateurs
      with:
        cfr: [100, 200, 50]
      expect: 350

    - title: Aucun générateur
      with:
        cfr: []
      expect: 0

refroidissement.cfr_elec:
  rule: cfr_elec
  cases:
    - title: Somme des consommations électriques
      with:
        cfr_elec: [150, 250]
      expect: 400

    - title: Aucun générateur
      with:
        cfr_elec: []
      expect: 0

refroidissement.caux:
  rule: caux
  cases:
    - title: Auxiliaires de refroidissement (toujours 0)
      with:
        caux: [0, 0]
      expect: 0

refroidissement.cef:
  rule: consommations
  cases:
    - title: Un seul générateur → consommations reportées telles quelles
      with:
        consommations:
          - refroidissement:
              electricite: { cef: 500, cep: 950, eges: 32 }
      expect:
        refroidissement:
          electricite: { cef: 500, cep: 950, eges: 32 }

    - title: Deux générateurs → consommations cumulées
      with:
        consommations:
          - refroidissement:
              electricite: { cef: 300, cep: 570, eges: 19.2 }
          - refroidissement:
              electricite: { cef: 200, cep: 380, eges: 12.8 }
      expect:
        refroidissement:
          electricite: { cef: 500, cep: 950, eges: 32 }

    - title: Aucun générateur → aucune consommation
      with:
        consommations: []
      expect: {}

refroidissement.e:
  rule: e
  cases:
    - title: Scénario conventionnel → ensoleillement à 28 °C de consigne
      with:
        scenario: conventionnel
        sollicitations: &sollicitations_fr
          "01": { efr26: 10, efr28: 5, textmoy26: 20, textmoy28: 30, nref26: 200, nref28: 100 }
          "02": { efr26: 10, efr28: 5, textmoy26: 20, textmoy28: 30, nref26: 200, nref28: 100 }
          "03": { efr26: 10, efr28: 5, textmoy26: 20, textmoy28: 30, nref26: 200, nref28: 100 }
          "04": { efr26: 10, efr28: 5, textmoy26: 20, textmoy28: 30, nref26: 200, nref28: 100 }
          "05": { efr26: 10, efr28: 5, textmoy26: 20, textmoy28: 30, nref26: 200, nref28: 100 }
          "06": { efr26: 10, efr28: 5, textmoy26: 20, textmoy28: 30, nref26: 200, nref28: 100 }
          "07": { efr26: 10, efr28: 5, textmoy26: 20, textmoy28: 30, nref26: 200, nref28: 100 }
          "08": { efr26: 10, efr28: 5, textmoy26: 20, textmoy28: 30, nref26: 200, nref28: 100 }
          "09": { efr26: 10, efr28: 5, textmoy26: 20, textmoy28: 30, nref26: 200, nref28: 100 }
          "10": { efr26: 10, efr28: 5, textmoy26: 20, textmoy28: 30, nref26: 200, nref28: 100 }
          "11": { efr26: 10, efr28: 5, textmoy26: 20, textmoy28: 30, nref26: 200, nref28: 100 }
          "12": { efr26: 10, efr28: 5, textmoy26: 20, textmoy28: 30, nref26: 200, nref28: 100 }
      expect: &parmois5
        "01": 5
        "02": 5
        "03": 5
        "04": 5
        "05": 5
        "06": 5
        "07": 5
        "08": 5
        "09": 5
        "10": 5
        "11": 5
        "12": 5

    - title: Scénario dépensier → ensoleillement à 26 °C de consigne
      with:
