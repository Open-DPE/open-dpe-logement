      with:
        gv: 100
        tint: 28
        as: *parmois10000
        ai: *parmois10000
        textmoy: *parmois30
        nref: *parmois100
        fut: *parmois05
        rbth:
          "01": 0.4
          "02": 0.4
          "03": 0.4
          "04": 0.4
          "05": 0.4
          "06": 0.4
          "07": 0.4
          "08": 0.4
          "09": 0.4
          "10": 0.4
          "11": 0.4
          "12": 0.4
      expect: *parmois0

    - title: Apports non compensés par les déperditions → besoins de refroidissement
      with:
        gv: 100
        tint: 28
        as: *parmois10000
        ai: *parmois10000
        textmoy: *parmois30
        nref: *parmois100
        fut: *parmois05
