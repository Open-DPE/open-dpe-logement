common.fcep:
  rule: fcep
  cases:
    - title: Électricité → 1.9 (arrêté 15/09/2006 annexe 4)
      with:
        energie: electricite
      expect: 1.9

    - title: Électricité renouvelable autoconsommée → 1.9
      with:
        energie: electricite_renouvelable
      expect: 1.9

    - title: Gaz naturel → 1
      with:
        energie: gaz_naturel
      expect: 1

    - title: Fioul → 1
      with:
        energie: fioul
      expect: 1

    - title: Bois bûche → 1
      with:
        energie: bois_buche
      expect: 1

    - title: Réseau de chaleur → 1
      with:
        energie: reseau_chaleur
      expect: 1

common.feges:
  rule: feges
  cases:
    - title: Électricité - chauffage → 0.079 kgCO2eq/kWh
      with:
        usage: chauffage
        energie: electricite
        reseau_id: null
      expect: 0.079

    - title: Électricité - ECS → 0.065 kgCO2eq/kWh
      with:
        usage: ecs
        energie: electricite
        reseau_id: null
      expect: 0.065

    - title: Électricité - refroidissement → 0.064 kgCO2eq/kWh
      with:
        usage: refroidissement
        energie: electricite
        reseau_id: null
      expect: 0.064

    - title: Électricité - éclairage → 0.069 kgCO2eq/kWh
      with:
        usage: eclairage
        energie: electricite
        reseau_id: null
      expect: 0.069

    - title: Électricité - auxiliaires → 0.069 kgCO2eq/kWh
      with:
        usage: auxiliaire
        energie: electricite
        reseau_id: null
      expect: 0.069

    - title: Électricité renouvelable autoconsommée → 0
      with:
        usage: chauffage
        energie: electricite_renouvelable
        reseau_id: null
      expect: 0

    - title: Gaz naturel → 0.227 kgCO2eq/kWh (indépendant de l'usage)
      with:
        usage: ecs
        energie: gaz_naturel
        reseau_id: null
      expect: 0.227

    - title: GPL → 0.272 kgCO2eq/kWh
      with:
        usage: chauffage
        energie: gpl
        reseau_id: null
      expect: 0.272

    - title: Fioul → 0.324 kgCO2eq/kWh
      with:
        usage: chauffage
        energie: fioul
        reseau_id: null
      expect: 0.324

    - title: Charbon → 0.385 kgCO2eq/kWh
      with:
        usage: chauffage
        energie: charbon
        reseau_id: null
      expect: 0.385

    - title: Bois bûche → 0.03 kgCO2eq/kWh
      with:
        usage: chauffage
        energie: bois_buche
        reseau_id: null
      expect: 0.03

    - title: Bois granulé → 0.03 kgCO2eq/kWh
      with:
        usage: chauffage
        energie: bois_granule
        reseau_id: null
      expect: 0.03

    - title: Bois plaquette → 0.024 kgCO2eq/kWh
      with:
        usage: chauffage
        energie: bois_plaquette
        reseau_id: null
      expect: 0.024

    - title: Réseau de chaleur sans identifiant → valeur par défaut 0.385
      with:
        usage: chauffage
        energie: reseau_chaleur
        reseau_id: null
      expect: 0.385

    - title: Réseau de froid sans identifiant → valeur par défaut 0.385
      with:
        usage: refroidissement
        energie: reseau_froid
        reseau_id: null
      expect: 0.385

    - title: Réseau de chaleur identifié → contenu CO2 ACV du réseau
      with:
        usage: chauffage
        energie: reseau_chaleur
        reseau_id: "0106C"
      expect: 0.037

    - title: Réseau identifié prioritaire sur l'énergie déclarée
      with:
        usage: chauffage
        energie: gaz_naturel
        reseau_id: "0108C"
      expect: 0.081

    - title: Identifiant de réseau inconnu → repli sur l'énergie
      with:
        usage: chauffage
        energie: reseau_chaleur
        reseau_id: RESEAU-INCONNU
      expect: 0.385

