common.consommations:
  rule: consommations
  cases:
    - title: Chauffage électrique sans autoconsommation
      with:
        cef: 1000
        cef_enr: 0
        usage: chauffage
        energie: electricite
        reseau_id: null
      expect:
        chauffage:
          electricite:
            cef: 1000
            cep: 1900
            eges: 79

    - title: Chauffage gaz sans autoconsommation
      with:
        cef: 1000
        cef_enr: 0
        usage: chauffage
        energie: gaz_naturel
        reseau_id: null
      expect:
        chauffage:
          gaz_naturel:
            cef: 1000
            cep: 1000
            eges: 227

    - title: Éclairage avec autoconsommation photovoltaïque
      with:
        cef: 1000
        cef_enr: 200
        usage: eclairage
        energie: electricite
        reseau_id: null
      expect:
        eclairage:
          electricite:
            cef: 800
            cep: 1520
            eges: 55.2
          electricite_renouvelable:
            cef: 200
            cep: 380
            eges: 0

    - title: Autoconsommation supérieure au besoin → consommation résiduelle nulle
      with:
        cef: 100
        cef_enr: 300
        usage: chauffage
        energie: electricite
        reseau_id: null
      expect:
        chauffage:
          electricite:
            cef: 0
            cep: 0
            eges: 0
          electricite_renouvelable:
            cef: 300
            cep: 570
            eges: 0

    - title: Autoconsommation ignorée si l'énergie n'est pas électrique
      with:
        cef: 1000
        cef_enr: 200
        usage: chauffage
        energie: gaz_naturel
        reseau_id: null
      expect:
        chauffage:
          gaz_naturel:
            cef: 800
            cep: 800
            eges: 181.6

    - title: Réseau de chaleur identifié → EGES au contenu CO2 ACV du réseau
      with:
        cef: 1000
        cef_enr: 0
        usage: chauffage
        energie: reseau_chaleur
        reseau_id: "0106C"
      expect:
        chauffage:
          reseau_chaleur:
            cef: 1000
            cep: 1000
            eges: 37

common.celec:
  rule: celec
  cases:
    - title: Énergie électrique → consommation reportée
      with:
        cef: 1200
        energie: electricite
      expect: 1200

    - title: Énergie non électrique → 0
      with:
        cef: 1200
        energie: gaz_naturel
      expect: 0

    - title: Électricité renouvelable non comptabilisée comme électricité consommée
      with:
        cef: 1200
        energie: electricite_renouvelable
      expect: 0

common.cener:
  rule: cener
  cases:
    - title: Consommation couvrant la totalité de l'usage → autoconsommation entière de l'usage
      with:
        celec:
          chauffage: 1000
        celec_ac:
          chauffage: 300
        usage: chauffage
        cef: 1000
      expect: 300

    - title: Consommation partielle → autoconsommation au prorata
      with:
        celec:
          chauffage: 1000
        celec_ac:
          chauffage: 300
        usage: chauffage
        cef: 400
      expect: 120

    - title: Aucune consommation d'électricité sur l'usage → 0
      with:
        celec:
          chauffage: 0
        celec_ac:
          chauffage: 300
        usage: chauffage
        cef: 400
      expect: 0
