enveloppe.baie.c1:
  rule: c1
  cases:
    - title: Baie verticale au sud en zone H1a → coefficient de référence égal à 1
      with:
        zone_climatique: H1a
        orientation: sud
        inclinaison: 90
      expect:
        "01": 1
        "02": 1
        "03": 1
        "04": 1
        "05": 1
        "06": 1
        "07": 1
        "08": 1
        "09": 1
        "10": 1
        "11": 1
        "12": 1

    - title: Baie verticale au nord en zone H1a → apports fortement réduits
      with:
        zone_climatique: H1a
        orientation: nord
        inclinaison: 90
      expect:
        "01": 0.31
        "02": 0.32
        "03": 0.37
        "04": 0.5
        "05": 0.65
        "06": 0.75
        "07": 0.7
        "08": 0.53
        "09": 0.41
        "10": 0.32
        "11": 0.36
        "12": 0.25

    - title: Baie horizontale (toiture) en zone H1a → apports maximaux en été
      with:
        zone_climatique: H1a
        orientation: horizontale
        inclinaison: 0
      expect:
        "01": 0.62
        "02": 0.74
        "03": 0.98
        "04": 1.45
        "05": 1.88
        "06": 2.19
        "07": 2.05
        "08": 1.59
        "09": 1.15
        "10": 0.81
        "11": 0.73
        "12": 0.51

    - title: Baie inclinée à 45° au sud en zone H1a → apports supérieurs à la verticale
      with:
        zone_climatique: H1a
        orientation: sud
        inclinaison: 45
      expect:
        "01": 1.67
        "02": 1.78
        "03": 1.99
        "04": 2.39
        "05": 2.74
        "06": 2.98
        "07": 2.87
        "08": 2.52
        "09": 2.14
        "10": 1.84
        "11": 1.74
        "12": 1.59

    - title: Zone climatique inconnue → erreur ValeurForfaitaire
      with:
        zone_climatique: INCONNUE
        orientation: sud
        inclinaison: 90
      expectError: true

    - title: Orientation inconnue → erreur ValeurForfaitaire
      with:
        zone_climatique: H1a
        orientation: ORIENTATION_INCONNUE
        inclinaison: 90
      expectError: true

enveloppe.local_non_chauffe.baie.c1:
  rule: c1
  cases:
