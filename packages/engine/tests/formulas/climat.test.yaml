      with:
        zone_climatique: H1a
        orientation: sud
        inclinaison: 90
      expect:
        "01": 1
        "02": 1
        "03": 1
        "04": 1
        "05": 1
        "06": 1
        "07": 1
        "08": 1
        "09": 1
        "10": 1
        "11": 1
        "12": 1

climat.sollicitations:
  rule: sollicitations
  cases:
    - title: Zone H1a, altitude 100 m, parois récentes, inertie légère → sollicitations mensuelles
      with:
        zone_climatique: H1a
        altitude: 100
        parois_anciennes: false
        inertie: legere
      expectPartial:
        "01":
          tefs: 7.8
          e: 38.36
          text: 2.6
          nref19: 744
          nref21: 744
          dh14: 8488
          dh19: 11712.4
          dh21: 13200.4
        "02":
          tefs: 5.5
          e: 37.47
          text: 3.5
          nref19: 672
          dh19: 9966.8
        "03":
          tefs: 6.9
          e: 77.61
          text: 7.7
          nref19: 738
          nref21: 741

    - title: Inertie moyenne rattachée à la même ligne d'abaque que l'inertie légère
      with:
        zone_climatique: H1a
        altitude: 100
        parois_anciennes: false
        inertie: moyenne
      expectPartial:
        "01":
          tefs: 7.8
          e: 38.36
          dh19: 11712.4

    # §18.3 ne s'applique qu'aux bâtiments cumulant parois anciennes ET inertie
    # lourde. Les trois cas ci-dessous vérifient que les combinaisons croisées
    # retombent bien sur le cas général du §18.2 (mai : mois discriminant).
    - title: Parois récentes à inertie lourde → cas général §18.2
      with:
        zone_climatique: H1a
        altitude: 100
        parois_anciennes: false
        inertie: lourde
      expectPartial:
        "05":
          e: 53.63
          text: 13.2
          nref19: 438
          dh19: 2762

    - title: Parois anciennes à inertie moyenne → cas général §18.2
      with:
        zone_climatique: H1a
        altitude: 100
        parois_anciennes: true
        inertie: moyenne
      expectPartial:
        "05":
          e: 53.63
          text: 13.2
          nref19: 438
          dh19: 2762

    - title: Parois anciennes à inertie lourde → §18.3, période de chauffe raccourcie
      with:
        zone_climatique: H1a
        altitude: 100
        parois_anciennes: true
        inertie: lourde
      expectPartial:
        "05":
          e: 19.19
          text: 12.8
          nref19: 172
          dh19: 1069.9

    - title: Parois anciennes à inertie très lourde → §18.3
      with:
        zone_climatique: H1a
        altitude: 100
        parois_anciennes: true
        inertie: tres_lourde
      expectPartial:
        "05":
          nref19: 172
          dh19: 1069.9

    - title: Zone climatique inconnue → aucune ligne d'abaque, erreur sur les mois manquants
      with:
        zone_climatique: INCONNUE
        altitude: 100
        parois_anciennes: false
        inertie: legere
      expectError: true
