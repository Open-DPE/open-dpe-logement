enveloppe.plancher_haut.dp:
  rule: dp
  cases:
    - title: Toiture terrasse sur l'extérieur (b = 1)
      with:
        sdep: 70
        b: 1
        u: 2.5
      expect: 175

    - title: Plancher haut sous comble non chauffé (b = 0.9)
      with:
        sdep: 70
        b: 0.9
        u: 2.5
      expect: 157.5

    - title: Plancher haut sous logement chauffé (b = 0) → aucune déperdition
      with:
        sdep: 70
        b: 0
        u: 2.5
      expect: 0

enveloppe.plancher_haut.isolation_aiu:
  rule: isolation_aiu
  cases:
    - title: Isolation saisie → retenue
      with:
        isolation: false
        annee_construction: 2010
      expect: false

    - title: Isolation inconnue, construction après 1974 → isolé
      with:
        isolation: null
        annee_construction: 1975
      expect: true

    - title: Isolation inconnue, construction en 1974 → non isolé
      with:
        isolation: null
        annee_construction: 1974
      expect: false

enveloppe.plancher_haut.u:
  rule: u
  cases:
    - title: U saisi → retenu tel quel
      with:
        u_saisi: 0.6
        zone_climatique: H1a
        effet_joule: false
        configuration: plancher
        u0: 2.5
        isolation: true
        type_isolation: ite
        epaisseur_isolation: 200
        resistance_thermique_isolation: null
        annee_isolation: null
        annee_construction: 1960
      expect: 0.6

    - title: Plancher haut déclaré non isolé → U = U0
      with:
        u_saisi: null
        zone_climatique: H1a
        effet_joule: false
        configuration: plancher
        u0: 1.45
        isolation: false
        type_isolation: null
        epaisseur_isolation: null
        resistance_thermique_isolation: null
        annee_isolation: null
        annee_construction: 1960
      expect: 1.45

    - title: Résistance thermique d'isolant connue → 1 / (1 / U0 + R)
      with:
        u_saisi: null
        zone_climatique: H1a
        effet_joule: false
        configuration: plancher
        u0: 2.5
        isolation: true
        type_isolation: ite
        epaisseur_isolation: null
        resistance_thermique_isolation: 5
        annee_isolation: null
        annee_construction: 1960
      expect: 0.1852

    - title: Épaisseur d'isolant connue → conductivité conventionnelle 0.04 W/(m.K)
      with:
        u_saisi: null
        zone_climatique: H1a
        effet_joule: false
        configuration: plancher
        u0: 2.5
        isolation: true
        type_isolation: ite
        epaisseur_isolation: 200
        resistance_thermique_isolation: null
        annee_isolation: null
        annee_construction: 1960
      expect: 0.1852

    - title: Isolation inconnue, construction avant 1975 → année conventionnelle 1976 (plancher H1a → 0.5)
      with:
        u_saisi: null
        zone_climatique: H1a
        effet_joule: false
        configuration: plancher
        u0: 2.5
        isolation: null
        type_isolation: null
        epaisseur_isolation: null
        resistance_thermique_isolation: null
        annee_isolation: null
        annee_construction: 1960
      expect: 0.5

    - title: Configuration terrasse plus pénalisante que plancher sur la même période (0.75)
      with:
        u_saisi: null
        zone_climatique: H1a
        effet_joule: false
        configuration: terrasse
        u0: 2.5
        isolation: null
        type_isolation: null
        epaisseur_isolation: null
        resistance_thermique_isolation: null
        annee_isolation: null
        annee_construction: 1960
      expect: 0.75

    - title: Configuration rampants alignée sur la configuration plancher (0.5)
      with:
        u_saisi: null
        zone_climatique: H1a
        effet_joule: false
        configuration: rampants
        u0: 2.5
        isolation: null
        type_isolation: null
        epaisseur_isolation: null
        resistance_thermique_isolation: null
        annee_isolation: null
        annee_construction: 1960
      expect: 0.5

    - title: Effet Joule pénalisant sur la période 1978-1982 (0.4 contre 0.5)
      with:
        u_saisi: null
        zone_climatique: H1a
        effet_joule: true
        configuration: plancher
        u0: 2.5
        isolation: null
        type_isolation: null
        epaisseur_isolation: null
        resistance_thermique_isolation: null
        annee_isolation: 1980
        annee_construction: 1960
      expect: 0.4

    - title: Construction à partir de 2013 → 0.14
      with:
        u_saisi: null
        zone_climatique: H1a
        effet_joule: false
        configuration: plancher
        u0: 2.5
        isolation: null
        type_isolation: null
        epaisseur_isolation: null
        resistance_thermique_isolation: null
        annee_isolation: null
        annee_construction: 2015
      expect: 0.14

    - title: La valeur forfaitaire ne peut pas dégrader le plancher nu (min avec U0)
      with:
        u_saisi: null
        zone_climatique: H1a
        effet_joule: false
        configuration: plancher
        u0: 0.24
        isolation: null
        type_isolation: null
        epaisseur_isolation: null
        resistance_thermique_isolation: null
        annee_isolation: null
        annee_construction: 1960
      expect: 0.24

    - title: Zone climatique inconnue → erreur ValeurForfaitaire
      with:
        u_saisi: null
        zone_climatique: INCONNUE
        effet_joule: false
        configuration: plancher
        u0: 2.5
        isolation: null
        type_isolation: null
        epaisseur_isolation: null
        resistance_thermique_isolation: null
        annee_isolation: null
        annee_construction: 1960
      expectError: true

enveloppe.plancher_haut.u0:
  rule: u0
  cases:
    - title: U0 saisi → retenu tel quel
      with:
        u0_saisi: 1.9
        type_plancher_haut: dalle_beton
      expect: 1.9

    - title: Type de plancher haut inconnu → valeur par défaut 2.5 W/m².K
      with:
        u0_saisi: null
        type_plancher_haut: null
      expect: 2.5

    - title: Dalle béton → 2.5 W/m².K
      with:
        u0_saisi: null
        type_plancher_haut: dalle_beton
      expect: 2.5

    - title: Plafond entre solives bois → 1.2 W/m².K
      with:
        u0_saisi: null
        type_plancher_haut: plafond_entre_solives_bois
      expect: 1.2

    - title: Plafond bois sur solives bois → 2 W/m².K
      with:
        u0_saisi: null
        type_plancher_haut: plafond_bois_sur_solives_bois
      expect: 2

    - title: Toiture en chaume → 0.24 W/m².K
      with:
        u0_saisi: null
        type_plancher_haut: toiture_chaume
      expect: 0.24

    - title: Bac acier → 2.5 W/m².K
      with:
        u0_saisi: null
        type_plancher_haut: bac_acier
      expect: 2.5

    - title: Type de plancher haut hors abaque → erreur ValeurForfaitaire
      with:
        u0_saisi: null
        type_plancher_haut: TYPE_INCONNU
      expectError: true

enveloppe.plancher_haut.isolation:
  rule: isolation
  cases:
    - title: Isolation saisie → retenue
      with:
        isolation: true
        annee_construction: 1950
      expect: true

    - title: Isolation inconnue, construction après 1974 → isolé
      with:
        isolation: null
        annee_construction: 1980
      expect: true

    - title: Isolation inconnue, construction en 1974 → non isolé
      with:
        isolation: null
        annee_construction: 1974
      expect: false
