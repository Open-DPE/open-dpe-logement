diagnostic.confort_ete:
  rule: confort_ete
  cases:
    - title: Absence de protection solaire → insuffisant
      with:
        type_diagnostic: logement
        presence_protection_solaire: false
        isolation_planchers_hauts: true
        inertie: tres_lourde
        logement_traversant: true
        presence_brasseur_air: true
      expect: insuffisant

    - title: Plancher haut non isolé → insuffisant
      with:
        type_diagnostic: logement
        presence_protection_solaire: true
        isolation_planchers_hauts: false
        inertie: tres_lourde
        logement_traversant: true
        presence_brasseur_air: true
      expect: insuffisant

    - title: Trois critères favorables (inertie lourde, traversant, brasseur) → bon
      with:
        type_diagnostic: logement
        presence_protection_solaire: true
        isolation_planchers_hauts: true
        inertie: lourde
        logement_traversant: true
        presence_brasseur_air: true
      expect: bon

    - title: Deux critères favorables sur trois → bon
      with:
        type_diagnostic: logement
        presence_protection_solaire: true
        isolation_planchers_hauts: true
        inertie: tres_lourde
        logement_traversant: true
        presence_brasseur_air: false
      expect: bon

    - title: Un seul critère favorable → moyen
      with:
        type_diagnostic: logement
        presence_protection_solaire: true
        isolation_planchers_hauts: true
        inertie: legere
        logement_traversant: true
        presence_brasseur_air: false
      expect: moyen

    - title: Aucun critère favorable → moyen
      with:
        type_diagnostic: logement
        presence_protection_solaire: true
        isolation_planchers_hauts: true
        inertie: moyenne
        logement_traversant: false
        presence_brasseur_air: false
      expect: moyen

    - title: Inertie moyenne non comptée comme inertie lourde
      with:
        type_diagnostic: logement
        presence_protection_solaire: true
        isolation_planchers_hauts: true
        inertie: moyenne
        logement_traversant: true
        presence_brasseur_air: false
      expect: moyen
