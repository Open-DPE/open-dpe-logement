chauffage.effet_joule:
  rule: effet_joule
  cases:
    - title: Installation unique à effet Joule → chauffage majoritairement électrique
      with:
        installations:
          - surface: 100
            effet_joule: true
      expect: true

    - title: Installation unique sans effet Joule → non
      with:
        installations:
          - surface: 100
            effet_joule: false
      expect: false

    - title: Exactement la moitié de la surface à effet Joule → oui (seuil inclusif)
      with:
        installations:
          - surface: 50
            effet_joule: true
          - surface: 50
            effet_joule: false
      expect: true

    - title: Minorité de la surface à effet Joule → non
      with:
        installations:
          - surface: 30
            effet_joule: true
          - surface: 70
            effet_joule: false
      expect: false

