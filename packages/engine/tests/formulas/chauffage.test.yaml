chauffage.cef:
  rule: consommations
  cases:
    - title: Un seul générateur → consommations reportées telles quelles
      with:
        consommations:
          - chauffage:
              gaz_naturel: { cef: 10000, cep: 10000, eges: 2270 }
      expect:
        chauffage:
          gaz_naturel: { cef: 10000, cep: 10000, eges: 2270 }

    - title: Deux générateurs de même énergie → consommations cumulées
      with:
        consommations:
          - chauffage:
              gaz_naturel: { cef: 6000, cep: 6000, eges: 1362 }
          - chauffage:
              gaz_naturel: { cef: 4000, cep: 4000, eges: 908 }
      expect:
        chauffage:
          gaz_naturel: { cef: 10000, cep: 10000, eges: 2270 }

    - title: Deux générateurs d'énergies différentes → consommations ventilées par énergie
      with:
        consommations:
          - chauffage:
              gaz_naturel: { cef: 6000, cep: 6000, eges: 1362 }
          - chauffage:
              electricite: { cef: 2000, cep: 3800, eges: 158 }
      expect:
        chauffage:
          gaz_naturel: { cef: 6000, cep: 6000, eges: 1362 }
          electricite: { cef: 2000, cep: 3800, eges: 158 }

    - title: Aucun générateur → aucune consommation
      with:
        consommations: []
      expect: {}

chauffage.cch:
  rule: cch
  cases:
    - title: Somme des consommations de chaque générateur
      with:
        cch: [6000, 4000]
      expect: 10000

    - title: Aucun générateur → 0
      with:
        cch: []
      expect: 0

chauffage.cch_elec:
  rule: cch_elec
  cases:
    - title: Somme des consommations électriques de chaque générateur
      with:
        cch_elec: [2000, 0]
      expect: 2000

    - title: Aucun générateur électrique → 0
      with:
        cch_elec: [0, 0]
      expect: 0

chauffage.caux:
  rule: caux
  cases:
    - title: Auxiliaires de chauffage = génération + distribution
      with:
        caux_gen: 120
        caux_dist: 80
      expect: 200

    - title: Aucun auxiliaire → 0
      with:
        caux_gen: 0
        caux_dist: 0
      expect: 0

chauffage.caux_gen:
  rule: caux_gen
  cases:
    - title: Somme des auxiliaires de génération
      with:
        caux_gen: [80, 40]
      expect: 120

    - title: Aucun générateur → 0
      with:
        caux_gen: []
      expect: 0

chauffage.caux_dist:
  rule: caux_dist
  cases:
    - title: Somme des auxiliaires de distribution des installations
      with:
        caux_dist: [50, 30]
      expect: 80

    - title: Aucune installation → 0
      with:
        caux_dist: []
      expect: 0

chauffage.pch:
  rule: pch
  cases:
    - title: Maison individuelle en zone H1a (Tbase -9.5 °C), GV 300 W/K
      with:
        ratio_proratisation: 1
        gv: 300
        tbase: -9.5
      expect: 11.9668

    - title: Appartement représentant la moitié du bâtiment → puissance rapportée au bâtiment entier
      with:
        ratio_proratisation: 0.5
        gv: 300
        tbase: -9.5
      expect: 23.9336

    - title: Zone H3 (Tbase -3.5 °C) → puissance plus faible
      with:
        ratio_proratisation: 1
        gv: 300
        tbase: -3.5
      expect: 9.4475

    - title: Déperditions nulles → puissance nulle
      with:
        ratio_proratisation: 1
        gv: 0
        tbase: -9.5
      expect: 0

