        presence_soubassement: null
        materiau: pvc
        presence_rupteur_pont_thermique: false
        ug: 3
      expect: 3

    - title: Type de baie inconnu → erreur ValeurForfaitaire
      with:
        uw_saisi: null
        type_baie: TYPE_INCONNU
        presence_soubassement: null
        materiau: pvc
        presence_rupteur_pont_thermique: false
        ug: 2.9
      expectError: true

