enveloppe.baie.dp:
  rule: dp
  cases:
    - title: Baie extérieure simple (b = 1)
      with:
        sdep: 10
        b: 1
        u: 4.5
        double_fenetre: false
      expect: 45

    - title: Double fenêtre → déperditions divisées par deux
      with:
        sdep: 10
        b: 1
        u: 4.5
        double_fenetre: true
      expect: 22.5

    - title: Baie sur local non chauffé (b = 0.8)
      with:
        sdep: 10
        b: 0.8
        u: 4.5
        double_fenetre: false
      expect: 36

    - title: Baie mitoyenne d'un logement chauffé (b = 0) → aucune déperdition
      with:
        sdep: 10
        b: 0
        u: 4.5
        double_fenetre: false
      expect: 0

enveloppe.baie.isolation_aiu:
  rule: isolation_aiu
  cases:
    - title: Triple vitrage → considéré isolant
      with:
        type_vitrage: triple_vitrage
      expect: true

    - title: Triple vitrage à faible émissivité → considéré isolant
      with:
        type_vitrage: triple_vitrage_fe
      expect: true

    - title: Double vitrage → non isolant
      with:
        type_vitrage: double_vitrage
      expect: false

    - title: Double vitrage à faible émissivité → non isolant
      with:
        type_vitrage: double_vitrage_fe
      expect: false

    - title: Simple vitrage → non isolant
      with:
        type_vitrage: simple_vitrage
      expect: false

enveloppe.baie.u:
  rule: u
  cases:
    - title: Ujn saisi → retenu tel quel
      with:
        ujn_saisi: 2
        uw: 2.7
        deltar: 0.15
      expect: 2

    - title: Aucune fermeture (deltar nul) → U = Uw
      with:
        ujn_saisi: null
        uw: 2.7
        deltar: 0
      expect: 2.7

    - title: Fermeture sans ajours (deltar 0.15), Uw 2.7 → Ujn 2.3
      with:
        ujn_saisi: null
        uw: 2.7
        deltar: 0.15
      expect: 2.3

    - title: Volets roulants PVC épais (deltar 0.19), Uw 2.7 → Ujn 2.2
      with:
        ujn_saisi: null
        uw: 2.7
        deltar: 0.19
      expect: 2.2

    - title: Uw intermédiaire → interpolation linéaire entre deux lignes d'abaque
      with:
        ujn_saisi: null
        uw: 2.75
        deltar: 0.15
      expect: 2.35

    - title: Deltar hors abaque → erreur ValeurForfaitaire
      with:
        ujn_saisi: null
        uw: 2.7
        deltar: 0.42
      expectError: true

enveloppe.baie.deltar:
  rule: deltar
  cases:
    - title: Aucune fermeture déclarée → 0
      with:
        types_fermetures: []
      expect: 0

    - title: Fermeture explicitement absente → 0
      with:
        types_fermetures: [sans_fermeture]
      expect: 0

    - title: Jalousie accordéon → 0.08 m².K/W
      with:
        types_fermetures: [jalousie_accordeon]
      expect: 0.08

    - title: Fermeture sans ajours → 0.15 m².K/W
      with:
        types_fermetures: [fermeture_sans_ajours]
      expect: 0.15

    - title: Volets roulants PVC/bois d'épaisseur inférieure à 12 mm → 0.19 m².K/W
      with:
        types_fermetures: [volets_roulants_pvc_bois_epaisseur_lte_12mm]
      expect: 0.19

    - title: Fermeture isolée sans ajours → 0.25 m².K/W
      with:
        types_fermetures: [fermeture_isolee_sans_ajours]
      expect: 0.25

    - title: Plusieurs fermetures → la plus performante est retenue
      with:
        types_fermetures: [jalousie_accordeon, fermeture_isolee_sans_ajours]
      expect: 0.25

    - title: Doublons ignorés
      with:
        types_fermetures: [fermeture_sans_ajours, fermeture_sans_ajours]
      expect: 0.15

    - title: Type de fermeture inconnu → erreur ValeurForfaitaire
      with:
        types_fermetures: [FERMETURE_INCONNUE]
      expectError: true

enveloppe.baie.uw:
  rule: uw
  cases:
    - title: Fenêtre simple → Uw de la menuiserie
      with:
        uw1: 2.7
        uw2: null
      expect: 2.7

    - title: Double fenêtre → résistances en série avec lame d'air de 0.07 m².K/W
      with:
        uw1: 2.7
        uw2: 2.7
      expect: 1.2334

    - title: Double fenêtre avec une menuiserie performante
      with:
        uw1: 4.5
        uw2: 1.5
      expect: 1.0429

