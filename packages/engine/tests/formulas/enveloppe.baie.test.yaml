      with:
        nature_lame_air: argon
      expect: argon

    - title: Nature de lame non saisie → air par défaut
      with:
        nature_lame_air: null
      expect: air

enveloppe.baie.epaisseur_lame_air:
  rule: epaisseur_lame_air
  cases:
    - title: Épaisseur saisie → retenue
      with:
        epaisseur_lame_air: 16
      expect: 16

    - title: Épaisseur non saisie → 6 mm par défaut
      with:
        epaisseur_lame_air: null
      expect: 6

enveloppe.baie.presence_rupteur_pont_thermique:
  rule: presence_rupteur_pont_thermique
  cases:
    - title: Présence saisie → retenue
      with:
        presence_rupteur_pont_thermique: true
      expect: true

    - title: Présence non saisie → absence par défaut
      with:
        presence_rupteur_pont_thermique: null
      expect: false

enveloppe.baie.isolation:
  rule: isolation
  cases:
    - title: Triple vitrage → isolée
      with:
        type_vitrage: triple_vitrage
      expect: true

    - title: Double vitrage → non isolée
      with:
        type_vitrage: double_vitrage
      expect: false
