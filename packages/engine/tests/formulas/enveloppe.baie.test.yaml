      with:
        type_vitrage: triple_vitrage
      expect: triple_vitrage

    - title: Type de vitrage non saisi → simple vitrage par défaut
      with:
        type_vitrage: null
      expect: simple_vitrage

enveloppe.baie.type_survitrage:
  rule: type_survitrage
  cases:
    - title: Type de survitrage saisi → retenu
      with:
        type_survitrage: survitrage_fe
      expect: survitrage_fe

    - title: Type de survitrage non saisi → survitrage simple par défaut
      with:
        type_survitrage: null
      expect: survitrage_simple

enveloppe.baie.materiau:
  rule: materiau
  cases:
    - title: Matériau saisi → retenu
      with:
        materiau: bois_metal
      expect: bois_metal

    - title: Matériau non saisi → PVC par défaut
