enveloppe.baie.sw:
  rule: sw
  cases:
    - title: Fenêtre simple → Sw de la menuiserie
      with:
        sw1: 0.52
        sw2: null
      expect: 0.52

    - title: Double fenêtre → produit des deux facteurs solaires
      with:
        sw1: 0.52
        sw2: 0.58
      expect: 0.3016

    - title: Seconde menuiserie opaque → apports solaires nuls
      with:
        sw1: 0.52
        sw2: 0
      expect: 0

enveloppe.baie.fe:
  rule: fe
  cases:
    - title: Aucun masque → facteur d'ensoleillement unitaire
      with:
        fe1: 1
        fe2: 1
      expect: 1

    - title: Masque proche et masque lointain → produit des deux facteurs
      with:
        fe1: 0.8
        fe2: 0.5
      expect: 0.4

    - title: Masque proche seul
      with:
        fe1: 0.4
        fe2: 1
      expect: 0.4

enveloppe.baie.fe1:
  rule: fe1
  cases:
    - title: Aucun masque proche → 1
      with:
        fe1: []
      expect: 1

    - title: Masque proche unique → son facteur
      with:
        fe1: [0.4]
      expect: 0.4

    - title: Plusieurs masques proches → le plus pénalisant est retenu
      with:
        fe1: [0.8, 0.4, 0.7]
      expect: 0.4

enveloppe.baie.fe2:
  rule: fe2
  cases:
    - title: Aucun masque lointain → 1
      with:
        fe2: []
        omb: 0
      expect: 1

    - title: Masque lointain homogène unique → son facteur
      with:
        fe2: [0.5]
        omb: 0
      expect: 0.5

    - title: Plusieurs masques homogènes → le plus pénalisant est retenu
      with:
        fe2: [0.8, 0.5]
        omb: 0
      expect: 0.5

    - title: Masque lointain non homogène (ombrage 35 %) → 0.65
      with:
        fe2: []
        omb: 35
      expect: 0.65

    - title: Masques homogènes et non homogènes → le plus pénalisant des deux
      with:
        fe2: [0.5]
        omb: 20
      expect: 0.5

    - title: Ombrage total (100 %) → facteur nul
      with:
        fe2: []
        omb: 100
      expect: 0

enveloppe.baie.omb:
  rule: omb
  cases:
    - title: Aucun masque non homogène → 0
      with:
        omb: []
      expect: 0

    - title: Masque unique → son coefficient d'ombrage
      with:
        omb: [35]
      expect: 35

    - title: Plusieurs masques → cumul des coefficients
      with:
        omb: [13, 14]
      expect: 27

    - title: Cumul plafonné à 100 %
      with:
        omb: [40, 45, 40]
      expect: 100

