        presence_soubassement: null
        materiau: pvc
        presence_rupteur_pont_thermique: false
        ug: 0.55
      expect: 0.95

    - title: Brique de verre pleine → valeur unique 3.5 (Ug non discriminant)
      with:
        uw_saisi: null
