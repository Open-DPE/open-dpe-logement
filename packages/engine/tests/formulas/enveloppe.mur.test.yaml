enveloppe.mur.dp:
  rule: dp
  cases:
    - title: Mur extérieur non isolé (b = 1)
      with:
        sdep: 50
        b: 1
        u: 2.5
      expect: 125

    - title: Mur sur local non chauffé (b = 0.8)
      with:
        sdep: 50
        b: 0.8
        u: 2.5
      expect: 100

    - title: Mur mitoyen d'un logement chauffé (b = 0) → aucune déperdition
      with:
        sdep: 50
        b: 0
        u: 2.5
      expect: 0

    - title: Surface déperditive nulle → aucune déperdition
      with:
        sdep: 0
        b: 1
        u: 2.5
      expect: 0

enveloppe.mur.isolation_aiu:
  rule: isolation_aiu
  cases:
    - title: Isolation saisie → retenue
      with:
        isolation: true
        annee_construction: 1960
      expect: true

    - title: Non-isolation saisie → retenue même après 1974
      with:
        isolation: false
        annee_construction: 1990
      expect: false

    - title: Isolation inconnue, construction après 1974 → isolé
      with:
        isolation: null
        annee_construction: 1990
      expect: true

    - title: Isolation inconnue, construction en 1974 → non isolé (seuil strict)
      with:
        isolation: null
        annee_construction: 1974
      expect: false

    - title: Isolation inconnue, construction avant 1974 → non isolé
      with:
        isolation: null
        annee_construction: 1950
      expect: false

enveloppe.mur.u:
  rule: u
  cases:
    - title: U saisi → retenu tel quel
      with:
        u_saisi: 1.2
        zone_climatique: H1a
        effet_joule: true
        u0: 2.5
        isolation: true
        type_isolation: iti
        epaisseur_isolation: 100
        resistance_thermique_isolation: null
        annee_isolation: null
        annee_construction: 1960
      expect: 1.2

    - title: Mur déclaré non isolé → U = U0
      with:
        u_saisi: null
        zone_climatique: H1a
        effet_joule: true
        u0: 2.05
        isolation: false
        type_isolation: null
        epaisseur_isolation: null
        resistance_thermique_isolation: null
        annee_isolation: null
        annee_construction: 1960
      expect: 2.05

    - title: Résistance thermique d'isolant connue → 1 / (1 / U0 + R)
      with:
        u_saisi: null
        zone_climatique: H1a
        effet_joule: true
        u0: 2.5
        isolation: true
        type_isolation: iti
        epaisseur_isolation: null
        resistance_thermique_isolation: 2
        annee_isolation: null
        annee_construction: 1960
      expect: 0.4167

    - title: Épaisseur d'isolant connue → conductivité conventionnelle 0.04 W/(m.K)
      with:
        u_saisi: null
        zone_climatique: H1a
        effet_joule: true
        u0: 2.5
        isolation: true
        type_isolation: iti
        epaisseur_isolation: 100
        resistance_thermique_isolation: null
        annee_isolation: null
        annee_construction: 1960
      expect: 0.3448

    - title: La résistance thermique est prioritaire sur l'épaisseur
      with:
        u_saisi: null
        zone_climatique: H1a
        effet_joule: true
        u0: 2.5
        isolation: true
        type_isolation: iti
        epaisseur_isolation: 100
        resistance_thermique_isolation: 2
        annee_isolation: null
        annee_construction: 1960
      expect: 0.4167

    - title: Isolation inconnue, construction avant 1975 → année d'isolation conventionnelle 1976 (H1a, 1 W/m².K)
      with:
        u_saisi: null
        zone_climatique: H1a
        effet_joule: true
        u0: 2.5
        isolation: null
        type_isolation: null
        epaisseur_isolation: null
        resistance_thermique_isolation: null
        annee_isolation: null
        annee_construction: 1960
      expect: 1

    - title: Isolation inconnue, construction en 1990 → abaque 1989-2000 hors effet Joule (0.5)
      with:
        u_saisi: null
        zone_climatique: H1a
        effet_joule: false
        u0: 2.5
        isolation: null
        type_isolation: null
        epaisseur_isolation: null
        resistance_thermique_isolation: null
        annee_isolation: null
        annee_construction: 1990
      expect: 0.5

    - title: Année d'isolation saisie prioritaire sur l'année de construction
      with:
        u_saisi: null
        zone_climatique: H1a
        effet_joule: true
        u0: 2.5
        isolation: null
        type_isolation: null
        epaisseur_isolation: null
        resistance_thermique_isolation: null
        annee_isolation: 1985
        annee_construction: 1950
      expect: 0.7

    - title: Effet Joule pénalisant sur la période 1978-1982 (H1a, 0.8 contre 1)
      with:
        u_saisi: null
        zone_climatique: H1a
        effet_joule: true
        u0: 2.5
        isolation: null
        type_isolation: null
        epaisseur_isolation: null
        resistance_thermique_isolation: null
        annee_isolation: 1980
        annee_construction: 1950
      expect: 0.8

    - title: La valeur forfaitaire ne peut pas dégrader le mur nu (min avec U0)
      with:
        u_saisi: null
        zone_climatique: H1a
        effet_joule: true
        u0: 0.3
        isolation: null
        type_isolation: null
        epaisseur_isolation: null
        resistance_thermique_isolation: null
        annee_isolation: null
        annee_construction: 1960
      expect: 0.3

    - title: Zone climatique inconnue → erreur ValeurForfaitaire
      with:
        u_saisi: null
        zone_climatique: INCONNUE
        effet_joule: true
        u0: 2.5
        isolation: null
        type_isolation: null
        epaisseur_isolation: null
        resistance_thermique_isolation: null
        annee_isolation: null
        annee_construction: 1960
      expectError: true

enveloppe.mur.u0:
  rule: u0
  cases:
    - title: Mur inconnu
      with:
        u0_saisi: null
        u0_enduit_isolant: null
        u0_doublage: null
        annee_construction: 2026
        structures: []
      expect: 2.5

    - title: Matériaux connus
      with:
        u0_saisi: null
        u0_enduit_isolant: null
        u0_doublage: null
        annee_construction: 2026
        structures:
          - materiau: pierre_moellons
            epaisseur: 50
          - materiau: pise_ou_beton_terre
            epaisseur: 50
      expect: 0.8826

    - title: U0 connu
      with:
        u0_saisi: 1.8
        u0_enduit_isolant: null
        u0_doublage: null
        annee_construction: 2026
        structures: []
      expect: 1.8

    - title: Enduit isolant + Doublage
      with:
        u0_saisi: null
        u0_enduit_isolant: 1
        u0_doublage: 1
        annee_construction: 2026
        structures: []
      expect: 0.4167

    - title: Structure unique en pierre de 50 cm → 2.05 W/m².K
      with:
        u0_saisi: null
        u0_enduit_isolant: null
        u0_doublage: null
        annee_construction: 2026
        structures:
          - materiau: pierre_moellons
            epaisseur: 50
      expect: 2.05

    - title: U0 saisi supérieur au plafond conventionnel → écrêté à 2.5
      with:
        u0_saisi: 4
        u0_enduit_isolant: null
        u0_doublage: null
        annee_construction: 2026
        structures: []
      expect: 2.5

    - title: Structure dont le matériau est inconnu → ignorée, repli sur 2.5
      with:
        u0_saisi: null
        u0_enduit_isolant: null
        u0_doublage: null
        annee_construction: 2026
        structures:
          - materiau: null
            epaisseur: 50
      expect: 2.5

    - title: Structure dont l'épaisseur est inconnue → ignorée, repli sur 2.5
      with:
        u0_saisi: null
        u0_enduit_isolant: null
        u0_doublage: null
        annee_construction: 2026
        structures:
          - materiau: pierre_moellons
            epaisseur: null
      expect: 2.5

    - title: Matériau hors abaque → erreur ValeurForfaitaire
      with:
        u0_saisi: null
        u0_enduit_isolant: null
        u0_doublage: null
        annee_construction: 2026
        structures:
          - materiau: MATERIAU_INCONNU
            epaisseur: 50
      expectError: true

enveloppe.mur.paroi_ancienne:
  rule: paroi_ancienne
  cases:
    - title: Une structure en matériau ancien → paroi ancienne
      with:
        structures:
          - materiau_ancien: true
      expect: true

    - title: Au moins une structure ancienne parmi plusieurs → paroi ancienne
      with:
        structures:
          - materiau_ancien: false
          - materiau_ancien: true
      expect: true

    - title: Aucune structure ancienne → paroi non ancienne
      with:
        structures:
          - materiau_ancien: false
      expect: false

    - title: Caractère ancien inconnu → paroi non ancienne
      with:
        structures:
          - materiau_ancien: null
      expect: false

    - title: Aucune structure → paroi non ancienne
      with:
        structures: []
      expect: false

enveloppe.mur.u0_enduit_isolant:
  rule: u0_enduit_isolant
  cases:
    - title: Paroi ancienne avec enduit isolant → 1 / 0.7
      with:
        paroi_ancienne: true
        presence_enduit_isolant: true
      expect: 1.4286

    - title: Paroi ancienne sans enduit isolant → 0
      with:
        paroi_ancienne: true
        presence_enduit_isolant: false
      expect: 0

    - title: Paroi récente avec enduit isolant → 0 (correction réservée aux parois anciennes)
      with:
        paroi_ancienne: false
        presence_enduit_isolant: true
      expect: 0

    - title: Présence d'enduit inconnue → 0
      with:
        paroi_ancienne: true
        presence_enduit_isolant: null
      expect: 0

enveloppe.mur.u0_doublage:
  rule: u0_doublage
  cases:
    - title: Sans doublage → 0
      with:
        type_doublage: sans_doublage
      expect: 0

    - title: Doublage indéterminé → 10
      with:
        type_doublage: indetermine
      expect: 10

    - title: Lame d'air inférieure à 15 mm → 10
      with:
        type_doublage: lame_air_inferieur_15mm
      expect: 10

    - title: Lame d'air supérieure à 15 mm → 21
      with:
        type_doublage: lame_air_superieur_15mm
      expect: 21

    - title: Doublage de matériau connu → 21
      with:
        type_doublage: materiaux_connu
      expect: 21

    - title: Doublage non renseigné → 0
      with:
        type_doublage: null
      expect: 0

enveloppe.mur.isolation:
  rule: isolation
  cases:
    - title: Isolation saisie → retenue
      with:
        isolation: false
        annee_construction: 2010
      expect: false

    - title: Isolation inconnue, construction après 1974 → isolé
      with:
        isolation: null
        annee_construction: 1975
      expect: true

    - title: Isolation inconnue, construction en 1974 → non isolé
      with:
        isolation: null
        annee_construction: 1974
      expect: false
