chauffage.systeme.rg_combustion:
  rule: rg_combustion
  cases:
    - title: Chaudière gaz et fioul classique
      with:
        scenario: conventionnel
        gv: 400
        tbase: -9.5
        pn: 30
        pn_combustion: 30
        pn_cascade: 0
        cascade: null
        type_generateur: chaudiere
        energie_generateur: gaz
        bienergie_generateur: null
        rpn: 0.85
        rpint: 0.8
        qp0: 0.3
        pveilleuse: 150
        kpcs: 1.11
        mode_combustion: standard
        presence_regulation: true
        tfonc30: 52.5
        tfonc100: 70
      expect: 0.747

chauffage.systeme.cef:
  rule: consommations
  cases:
    - title: Chaudière gaz avec circulateur → consommations de chauffage et d'auxiliaires
      with:
        cch: 10000
        cch_enr: 0
        caux_dist: 500
        caux_dist_enr: 0
        energie: gaz_naturel
        reseau_id: null
      expect:
        chauffage:
          gaz_naturel: { cef: 10000, cep: 10000, eges: 2270 }
        auxiliaire:
          electricite: { cef: 500, cep: 950, eges: 34.5 }

    - title: Système électrique sans auxiliaire de distribution
      with:
        cch: 5000
        cch_enr: 0
        caux_dist: 0
        caux_dist_enr: 0
        energie: electricite
        reseau_id: null
      expect:
        chauffage:
          electricite: { cef: 5000, cep: 9500, eges: 395 }
        auxiliaire:
          electricite: { cef: 0, cep: 0, eges: 0 }

    - title: Système raccordé à un réseau de chaleur identifié
      with:
        cch: 10000
        cch_enr: 0
        caux_dist: 0
        caux_dist_enr: 0
        energie: reseau_chaleur
        reseau_id: "0106C"
      expectPartial:
        chauffage:
          reseau_chaleur: { cef: 10000, cep: 10000, eges: 370 }

chauffage.systeme.cch:
  rule: cch
  cases:
    - title: Générateur simple → seule la part principale est comptée
      with:
        cch1: 8000
        cch2: null
      expect: 8000

    - title: PAC hybride → somme des deux parts
      with:
        cch1: 6400
        cch2: 1600
      expect: 8000

chauffage.systeme.cch1:
  rule: cch1
  cases:
    - title: Somme des consommations des émissions rattachées au système
      with:
        cch1: [3000, 2000]
      expect: 5000

    - title: Aucune émission → 0
      with:
        cch1: []
      expect: 0

chauffage.systeme.cch2:
  rule: cch2
  cases:
    - title: Somme des consommations de la partie chaudière des PAC hybrides
      with:
        cch2: [800, 800]
      expect: 1600

    - title: Aucune émission → 0
      with:
        cch2: []
      expect: 0

chauffage.systeme.cch_elec:
  rule: cch_elec
  cases:
    - title: Générateur électrique → consommation reportée en électricité
      with:
        cch1: 5000
        energie_generateur: electricite
      expect: 5000

    - title: Générateur gaz → aucune consommation électrique de chauffage
      with:
        cch1: 5000
        energie_generateur: gaz_naturel
      expect: 0

chauffage.systeme.cch_enr:
  rule: cch_enr
  cases:
    - title: Part d'électricité autoconsommée affectée au chauffage au prorata de la consommation
      with:
        celec:
          chauffage: 1000
        celec_ac:
          chauffage: 300
        cch_elec: 1000
      expect: 300

    - title: Consommation partielle → autoconsommation au prorata
      with:
        celec:
          chauffage: 1000
        celec_ac:
          chauffage: 300
        cch_elec: 500
      expect: 150

    - title: Aucune consommation électrique de chauffage → aucune part renouvelable
      with:
        celec:
          chauffage: 1000
        celec_ac:
          chauffage: 300
        cch_elec: 0
      expect: 0

chauffage.systeme.caux_dist:
  rule: caux_dist
  cases:
    - title: Circulateur de 100 W fonctionnant 8928 h/an → 892.8 kWh/an
      with:
        pcircem: 100
        nref:
          &nref744
          "01": 744
          "02": 744
          "03": 744
          "04": 744
          "05": 744
          "06": 744
          "07": 744
          "08": 744
          "09": 744
          "10": 744
          "11": 744
          "12": 744
      expect: 892.8

    - title: Aucun circulateur → aucune consommation d'auxiliaire
      with:
        pcircem: 0
        nref: *nref744
      expect: 0

chauffage.systeme.caux_dist_enr:
  rule: caux_dist_enr
  cases:
    - title: Part d'électricité autoconsommée affectée aux auxiliaires de distribution
      with:
        celec:
          auxiliaires_distribution: 1000
        celec_ac:
          auxiliaires_distribution: 200
        caux_dist: 500
      expect: 100

    - title: Aucune consommation d'auxiliaire → aucune part renouvelable
      with:
        celec:
          auxiliaires_distribution: 1000
        celec_ac:
          auxiliaires_distribution: 200
        caux_dist: 0
      expect: 0

chauffage.systeme.int:
  rule: int
  cases:
    - title: Moyenne des facteurs d'intermittence des émissions
      with:
        int: [0.9, 0.8]
      expect: 0.85

    - title: Émission unique → son facteur d'intermittence
      with:
        int: [0.95]
      expect: 0.95

chauffage.systeme.ich:
  rule: ich
  cases:
    - title: Moyenne des inverses de rendement des émissions
      with:
        ich: [1.5, 2.5]
      expect: 2

    - title: Émission unique → son inverse de rendement
      with:
        ich: [1.6]
      expect: 1.6

chauffage.systeme.rd:
  rule: rd
  cases:
    - title: Aucune distribution (émetteur direct) → rendement unitaire
      with:
        type_distribution: null
        temperature_distribution: null
        presence_fluide_frigorigene: null
        reseau_collectif: null
        isolation_reseau: null
      expect: 1

    - title: Distribution par fluide frigorigène → rendement unitaire
      with:
        type_distribution: hydraulique
        temperature_distribution: haute
        presence_fluide_frigorigene: true
        reseau_collectif: false
        isolation_reseau: false
      expect: 1

    - title: Hydraulique haute température, réseau individuel isolé → 0.92
      with:
        type_distribution: hydraulique
        temperature_distribution: haute
        presence_fluide_frigorigene: false
        reseau_collectif: false
        isolation_reseau: true
      expect: 0.92

    - title: Hydraulique basse température, réseau individuel isolé → 0.95
      with:
        type_distribution: hydraulique
        temperature_distribution: basse
        presence_fluide_frigorigene: false
        reseau_collectif: false
        isolation_reseau: true
      expect: 0.95

    - title: Hydraulique haute température, réseau collectif isolé → 0.87
      with:
        type_distribution: hydraulique
        temperature_distribution: haute
        presence_fluide_frigorigene: false
        reseau_collectif: true
        isolation_reseau: true
      expect: 0.87

    - title: Hydraulique haute température, réseau individuel non isolé → 0.88
      with:
        type_distribution: hydraulique
        temperature_distribution: haute
        presence_fluide_frigorigene: false
        reseau_collectif: false
        isolation_reseau: false
      expect: 0.88

    - title: Hydraulique haute température, réseau collectif non isolé → 0.85
      with:
        type_distribution: hydraulique
        temperature_distribution: haute
        presence_fluide_frigorigene: false
        reseau_collectif: true
        isolation_reseau: false
      expect: 0.85

    - title: Aéraulique isolé → 0.85
      with:
        type_distribution: aeraulique
        temperature_distribution: null
        presence_fluide_frigorigene: false
        reseau_collectif: null
        isolation_reseau: true
      expect: 0.85

    - title: Aéraulique non isolé → 0.8
      with:
        type_distribution: aeraulique
        temperature_distribution: null
        presence_fluide_frigorigene: false
        reseau_collectif: null
        isolation_reseau: false
      expect: 0.8

    - title: Type de distribution inconnu → erreur ValeurForfaitaire
      with:
        type_distribution: DISTRIBUTION_INCONNUE
        temperature_distribution: haute
        presence_fluide_frigorigene: false
        reseau_collectif: false
        isolation_reseau: true
      expectError: true

chauffage.systeme.re:
  rule: re
  cases:
    - title: Moyenne des rendements d'émission
      with:
        re: [0.95, 1]
      expect: 0.975

    - title: Émission unique → son rendement
      with:
        re: [0.95]
      expect: 0.95

chauffage.systeme.rr:
  rule: rr
  cases:
    - title: Moyenne des rendements de régulation
      with:
        rr: [0.9, 0.96]
      expect: 0.93

    - title: Émission unique → son rendement
      with:
        rr: [0.95]
      expect: 0.95

chauffage.systeme.rg:
  rule: rg_pac
  cases:
    - title: Pompe à chaleur classique → rendement de génération unitaire (le SCOP porte la performance)
      with: {}
      expect: 1

chauffage.systeme.rg_reseau_chaleur:
  rule: rg_reseau_chaleur
  cases:
    - title: Réseau de chaleur ou générateur multi-bâtiment → 0.97
      with: {}
      expect: 0.97

chauffage.systeme.rg_autres:
  rule: rg_autres
  cases:
    - title: Poêle bois bûche labellisé Flamme Verte installé en 2010 → 0.7
      with:
        type_generateur: poele
        energie_generateur: bois_buche
        label_generateur: flamme_verte
        annee_installation_generateur: 2010
      expect: 0.7

    - title: Poêle bois bûche labellisé installé à partir de 2018 → 0.75
      with:
        type_generateur: poele
        energie_generateur: bois_buche
        label_generateur: flamme_verte
        annee_installation_generateur: 2020
      expect: 0.75

    - title: Poêle bois bûche non labellisé installé avant 1990 → 0.5
      with:
        type_generateur: poele
        energie_generateur: bois_buche
        label_generateur: null
        annee_installation_generateur: 1985
      expect: 0.5

    - title: Poêle bois bûche non labellisé installé entre 1990 et 2004 → 0.6
      with:
        type_generateur: poele
        energie_generateur: bois_buche
        label_generateur: null
        annee_installation_generateur: 1995
      expect: 0.6

    - title: Poêle à granulés non labellisé → 0.8
      with:
        type_generateur: poele
        energie_generateur: bois_granule
        label_generateur: null
        annee_installation_generateur: 2020
      expect: 0.8

    - title: Poêle à granulés labellisé installé à partir de 2020 → 0.87
      with:
        type_generateur: poele
        energie_generateur: bois_granule
        label_generateur: flamme_verte
        annee_installation_generateur: 2021
      expect: 0.87

    - title: Insert non labellisé installé en 1995 → 0.6
      with:
        type_generateur: insert
        energie_generateur: bois_buche
        label_generateur: null
        annee_installation_generateur: 1995
      expect: 0.6

    - title: Émetteur électrique → rendement de génération unitaire
      with:
        type_generateur: convecteur_electrique
        energie_generateur: electricite
        label_generateur: null
        annee_installation_generateur: 2000
      expect: 1

    - title: Chaudière électrique → 0.97
      with:
        type_generateur: chaudiere
        energie_generateur: electricite
        label_generateur: null
        annee_installation_generateur: 2000
      expect: 0.97

    - title: Réseau de chaleur → 0.97
      with:
        type_generateur: reseau_chaleur
        energie_generateur: reseau_chaleur
        label_generateur: null
        annee_installation_generateur: 2000
      expect: 0.97

    - title: Générateur hors abaque → erreur ValeurForfaitaire
      with:
        type_generateur: GENERATEUR_INCONNU
        energie_generateur: gaz_naturel
        label_generateur: null
        annee_installation_generateur: 2000
      expectError: true

chauffage.systeme.pe:
