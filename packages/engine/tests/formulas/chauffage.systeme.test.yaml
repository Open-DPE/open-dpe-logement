chauffage.systeme.pch:
  rule: pch
  cases:
    - title: Système unique d'une installation individuelle → puissance de l'installation
      with:
        pch_installation: 12
        installation_collective: false
        generateur_individuel: false
        systemes: []
      expect: 12

    - title: Générateur individuel d'une installation collective → moitié de la puissance
      with:
        pch_installation: 12
        installation_collective: true
        generateur_individuel: true
        systemes: []
      expect: 6

    - title: Deux générateurs individuels d'une installation collective → moitié répartie
      with:
        pch_installation: 12
        installation_collective: true
        generateur_individuel: true
        systemes:
          - generateur_individuel: true
      expect: 3

    - title: Trois systèmes de même nature → puissance répartie à parts égales
      with:
        pch_installation: 12
        installation_collective: false
        generateur_individuel: false
        systemes:
          - generateur_individuel: false
          - generateur_individuel: false
      expect: 4

chauffage.systeme.pcircem:
  rule: pcircem
  cases:
    - title: Aucun émetteur → aucun circulateur
      with:
        gv: 100
        tbase: -9.5
        sh: 100
        niveaux_desservis: 1
        presence_circulateur_externe: true
        rdim: 1
        emetteurs: []
      expect: 0

    - title: Absence de circulateur externe → puissance nulle
      with:
        gv: 100
        tbase: -9.5
        sh: 100
        niveaux_desservis: 1
        presence_circulateur_externe: false
        rdim: 1
        emetteurs:
          - delta_pem: 10
            fcot: 0.802
            dtheta_dim: 15
      expect: 0

    - title: Petite installation → puissance plancher de 30 W
      with:
        gv: 100
        tbase: -9.5
