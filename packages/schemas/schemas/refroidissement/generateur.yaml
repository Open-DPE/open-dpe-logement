$id: https://schemas.open-dpe.fr/refroidissement/generateur
$schema: https://json-schema.org/draft/2020-12/schema
title: Générateur de refroidissement
type: object
unevaluatedProperties: false
properties:
  id:
    $ref: /common#/$defs/id
  description:
    $ref: /common#/$defs/description
  type:
    title: Type de générateur
    type: string
    x-enum: refroidissement:type-generateur
    enum:
      - pac_air_air
      - pac_air_eau
      - pac_eau_eau
      - pac_eau_glycolee_eau
      - pac_geothermique
      - autre_systeme_thermodynamique
      - autre
      - reseau_froid
  energie:
    title: Énergie utilisée par le générateur
    type: string
    x-enum: energie
    enum: [electricite, gaz_naturel, gpl, reseau_froid]
  annee_installation:
    $ref: /common#/$defs/annee_installation
  seer:
    title: Coefficient d'efficience énergétique saisonnier
    oneOf:
      - $ref: /common#/$defs/nombre_positif
      - const: null
  reseau_froid_id:
    title: Identifiant unique du réseau de froid
    type: [string, "null"]
  data:
    $ref: "#/$defs/data"
required:
  - id
  - description
  - type
  - energie
  - annee_installation
  - seer
  - reseau_froid_id

oneOf:
  - title: Pompe à chaleur
    type: object
    properties:
      type:
        enum:
          - pac_air_air
          - pac_air_eau
          - pac_eau_eau
          - pac_eau_glycolee_eau
          - pac_geothermique
          - autre_systeme_thermodynamique
      energie:
        const: electricite
      reseau_froid_id:
        $ref: "/common#/$defs/non_applicable"
    required:
      - type
      - energie
      - reseau_froid_id

  - title: Climatiseur
    type: object
    properties:
      type:
        const: autre
      energie:
        enum:
          - electricite
          - gaz_naturel
          - gpl
      reseau_froid_id:
        $ref: "/common#/$defs/non_applicable"
    required:
      - type
      - energie
      - reseau_froid_id

  - title: Réseau de froid
    type: object
    properties:
      type:
        const: reseau_froid
        default: reseau_froid
      energie:
        const: reseau_froid
        default: reseau_froid
    required:
      - type
      - energie

$defs:
  data:
    title: Données calculées
    type: object
    readOnly: true
    additionalProperties: false
    properties:
      consommations:
        title: Consommations par usage et par énergie du générateur de refroidissement
        $ref: /common#/$defs/consommations
      rdim:
        title: Ratio de dimensionnement du générateur de refroidissement
        type: number
      eer:
        title: Efficacité énergétique saisonnière (EER) du générateur de refroidissement
        type: number
    required: [consommations, rdim, eer]
