$id: https://schemas.open-dpe.fr/refroidissement/installation
$schema: https://json-schema.org/draft/2020-12/schema
title: Installation de refroidissement
type: object
additionalProperties: false
properties:
  id:
    $ref: /common#/$defs/id
  description:
    $ref: /common#/$defs/description
  surface:
    title: Surface couverte par l'installation en m²
    $ref: /common#/$defs/surface
  generateurs:
    title: Liste des générateurs de refroidissement associés
    type: array
    minItems: 1
    items:
      $ref: /common#/$defs/id
  data:
    $ref: "#/$defs/data"
required:
  - id
  - description
  - surface
  - generateurs

$defs:
  data:
    title: Données calculées
    type: object
    readOnly: true
    additionalProperties: false
    properties:
      rdim:
        title: Ratio de dimensionnement de l'installation de refroidissement
        type: number
    required: [rdim]
