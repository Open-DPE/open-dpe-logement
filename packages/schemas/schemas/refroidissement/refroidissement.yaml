$id: https://schemas.open-dpe.fr/refroidissement
$schema: https://json-schema.org/draft/2020-12/schema
title: Refroidissement
type: object
unevaluatedProperties: false
properties:
  generateurs:
    title: Liste des générateurs
    description: Le nombre de générateurs doit être égal au nombre de générateurs uniques référencés dans les installations.
    type: array
    items:
      $ref: /refroidissement/generateur
  installations:
    title: Liste des installations
    type: array
    items:
      $ref: /refroidissement/installation
  data:
    $ref: "#/$defs/data"
required:
  - generateurs
  - installations

oneOf:
  - title: Aucune installation de refroidissement
    properties:
      installations:
        maxItems: 0
      generateurs:
        maxItems: 0

  - title: Au moins une installation de refroidissement
    properties:
      installations:
        minItems: 1
      generateurs:
        minItems: 1

$defs:
  data:
    title: Données calculées
    type: object
    readOnly: true
    additionalProperties: false
    properties:
      bfr:
        title: Besoins de refroidissement en kWh/an
        type: number
      as:
        title: Apports solaires en période de refroidissement en kWh/an
        type: number
      ai:
        title: Apports internes en période de refroidissement en kWh/an
        type: number
    required:
      - bfr
      - as
      - ai
