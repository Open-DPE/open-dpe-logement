$id: https://schemas.open-dpe.fr/ventilation/installation
$schema: https://json-schema.org/draft/2020-12/schema
title: Installation de ventilation
type: object
unevaluatedProperties: false
properties:
  id:
    $ref: /common#/$defs/id
  description:
    $ref: /common#/$defs/description
  surface:
    $ref: /common#/$defs/surface
  type:
    title: Type de ventilation
    type: string
    x-enum: ventilation:type
    enum:
      - ventilation_ouverture_fenetres
      - ventilation_entrees_air_hautes_basses
      - ventilation_naturelle_conduit_entrees_air_hygroreglables
      - ventilation_naturelle_conduit
      - vmc_simple_flux_autoreglable
      - vmc_simple_flux_hygroreglable_a
      - vmc_simple_flux_hygroreglable_gaz
      - vmc_simple_flux_hygroreglable_b
      - vmc_basse_pression_autoreglable
      - vmc_basse_pression_hygroreglable_a
      - vmc_basse_pression_hygroreglable_b
      - vmc_double_flux
      - ventilation_hybride
      - ventilation_hybride_entrees_air_hygroreglables
      - ventilation_mecanique_conduit
      - ventilation_mecanique_insufflation
      - puit_climatique
  installation_collective:
    title: Installation collective
    type: [boolean, "null"]
  presence_echangeur_thermique:
    title: Présence d'un échangeur thermique
    type: [boolean, "null"]
  annee_installation:
    $ref: /common#/$defs/annee_installation
  data:
    $ref: "#/$defs/data"
required:
  - id
  - description
  - surface
  - type
  - installation_collective
  - presence_echangeur_thermique
  - annee_installation

$defs:
  data:
    title: Données calculées
    type: object
    readOnly: true
    additionalProperties: false
    properties:
      consommations:
        title: Consommations par usage et par énergie de l'installation de ventilation
        $ref: /common#/$defs/consommations
      pvent_moy:
        title: Puissance moyenne de ventilation en W
        type: number
      rdim:
        title: Ratio de dimensionnement de l'installation de ventilation
        type: number
      qvarep_conv:
        title: Débit volumique conventionnel à reprendre en m3/(h.m²)
        type: number
      qvasouf_conv:
        title: Débit volumique conventionnel à souffler en m3/(h.m²)
        type: number
      smea_conv:
        title: Somme des modules d'entrée d'air sous 20 Pa par unité de surface habitable en m3/(h.m²)
        type: number
      hvent:
        title: Déperditions thermiques par renouvellement d'air due aux systèmes de ventilation en W/K
        type: number
    required:
      - consommations
      - pvent_moy
      - rdim
      - qvarep_conv
      - qvasouf_conv
      - smea_conv
      - hvent

oneOf:
  - title: Installation naturelle
    type: object
    properties:
      type:
        enum:
          - ventilation_ouverture_fenetres
          - ventilation_entrees_air_hautes_basses
          - ventilation_naturelle_conduit_entrees_air_hygroreglables
          - ventilation_naturelle_conduit
      installation_collective:
        $ref: "/common#/$defs/non_applicable"
      presence_echangeur_thermique:
        $ref: "/common#/$defs/non_applicable"
      annee_installation:
        $ref: "/common#/$defs/non_applicable"
    required:
      - type
      - installation_collective
      - presence_echangeur_thermique
      - annee_installation
  - title: Installation mécanique - VMC Double flux / Puit climatique
    type: object
    properties:
      type:
        enum: [vmc_double_flux, puit_climatique]
      installation_collective:
        type: boolean
    required:
      - type
      - installation_collective
  - title: Installation mécanique - Autres
    type: object
    properties:
      type:
        enum:
          - vmc_simple_flux_autoreglable
          - vmc_simple_flux_hygroreglable_a
          - vmc_simple_flux_hygroreglable_b
          - vmc_simple_flux_hygroreglable_gaz
          - vmc_basse_pression_autoreglable
          - vmc_basse_pression_hygroreglable_a
          - vmc_basse_pression_hygroreglable_b
          - ventilation_hybride
          - ventilation_hybride_entrees_air_hygroreglables
          - ventilation_mecanique_conduit
          - ventilation_mecanique_insufflation
      presence_echangeur_thermique:
        $ref: "/common#/$defs/non_applicable"
    required:
      - type
      - presence_echangeur_thermique
