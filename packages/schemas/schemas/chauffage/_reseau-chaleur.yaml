$id: https://schemas.open-dpe.fr/chauffage/reseau-chaleur
$schema: https://json-schema.org/draft/2020-12/schema
title: Réseau de chaleur
type: object
unevaluatedProperties: false

allOf:
  - $ref: /chauffage/generateur-base

properties:
  type:
    const: reseau_chaleur
  energie:
    const: reseau_chaleur
  bienergie:
    $ref: "/common#/$defs/non_applicable"
  position:
    type: object
    properties:
      cascade:
        $ref: "/common#/$defs/non_applicable"
      position_chaudiere:
        $ref: "/common#/$defs/non_applicable"
      generateur_collectif:
        const: true
        default: true
      generateur_multi_batiment:
        const: true
        default: true
      position_volume_chauffe:
        const: false
        default: false
      generateur_mixte_id:
        $ref: "/common#/$defs/non_applicable"
      reseau_chaleur_id:
        type: [string, "null"]
    required:
      - position_chaudiere
      - cascade
      - generateur_collectif
      - generateur_multi_batiment
      - position_volume_chauffe
      - generateur_mixte_id
      - reseau_chaleur_id
  signaletique:
    type: object
    properties:
      pn:
        $ref: "/common#/$defs/non_applicable"
      label:
        $ref: "/common#/$defs/non_applicable"
      scop:
        $ref: "/common#/$defs/non_applicable"
      mode_combustion:
        $ref: "/common#/$defs/non_applicable"
      presence_regulation:
        $ref: "/common#/$defs/non_applicable"
      presence_ventouse:
        $ref: "/common#/$defs/non_applicable"
      pveilleuse:
        $ref: "/common#/$defs/non_applicable"
      qp0:
        $ref: "/common#/$defs/non_applicable"
      rpn:
        $ref: "/common#/$defs/non_applicable"
      rpint:
        $ref: "/common#/$defs/non_applicable"
      tfonc30:
        $ref: "/common#/$defs/non_applicable"
      tfonc100:
        $ref: "/common#/$defs/non_applicable"
    required:
      - pn
      - label
      - scop
      - mode_combustion
      - presence_regulation
      - presence_ventouse
      - pveilleuse
      - qp0
      - rpn
      - rpint
      - tfonc30
      - tfonc100
required:
  - type
  - energie
  - bienergie
  - position
  - signaletique
