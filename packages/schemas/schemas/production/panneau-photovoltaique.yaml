$id: https://schemas.open-dpe.fr/production/panneau-photovoltaique
$schema: https://json-schema.org/draft/2020-12/schema
title: Panneau photovoltaïque
type: object
additionalProperties: false
properties:
  id:
    $ref: /common#/$defs/id
  description:
    $ref: /common#/$defs/description
  orientation:
    $ref: /common#/$defs/orientation
  inclinaison:
    $ref: /common#/$defs/inclinaison
  modules:
    title: Nombre de modules
    type: integer
    minimum: 1
    maximum: 1000
  surface:
    title: Surface totale des capteurs en m²
    anyOf:
      - $ref: /common#/$defs/surface
      - const: null
  installation_collective:
    title: Installation photovoltaïque collective
    type: boolean
  data:
    $ref: "#/$defs/data"

required:
  - id
  - description
  - orientation
  - inclinaison
  - modules
  - surface
  - installation_collective

$defs:
  data:
    title: Données calculées
    type: object
    readOnly: true
    additionalProperties: false
    properties:
      ppv:
        title: Production photovoltaïque mensuelle en kWh/an
        type: number
      kpv:
        title: Coefficient de production photovoltaïque mensuel
        type: number
    required: [ppv, kpv]
