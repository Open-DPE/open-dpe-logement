              orientation:
                enum:
                  - est
                  - ouest
              masques:
                type: array
                items:
                  type: object
                  properties:
                    secteur:
                      enum:
                        - lateral
                        - lateral_sud
                        - central
                        - central_sud
                        - null
            required:
              - inclinaison
              - orientation
              - masques
          - title: Baie horizontale
            type: object
            properties:
              inclinaison:
                const: 0
              orientation:
                const: horizontale
            required:
              - inclinaison
              - orientation
      menuiserie:
        title: Menuiserie
        type: object
        additionalProperties: false
