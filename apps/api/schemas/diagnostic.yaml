            x-enum: enveloppe:baie:materiau
            enum:
              - pvc
              - bois
              - bois_metal
              - metal
              - null
          largeur_dormant:
            title: Largeur dormant en mm
            oneOf:
              - $ref: /common#/$defs/nombre_positif
              - const: null
          presence_soubassement:
            title: Présence d'un soubassement
            type: boolean
          presence_joint:
            title: Présence de joint d'étanchéité
            type:
              - boolean
              - 'null'
          presence_retour_isolation:
            title: Présence d'un retour d'isolation
            type:
              - boolean
              - 'null'
          presence_rupteur_pont_thermique:
            title: Présence d'un rupteur de pont thermique
            type:
              - boolean
              - 'null'
        required:
          - materiau
          - largeur_dormant
          - presence_soubassement
          - presence_joint
          - presence_retour_isolation
          - presence_rupteur_pont_thermique
      vitrage:
        title: Vitrage
        type: object
        unevaluatedProperties: false
        properties:
          type:
            title: Type
            type:
              - string
              - 'null'
            x-enum: enveloppe:baie:type-vitrage
            enum:
              - brique_verre
              - polycarbonate
              - simple_vitrage
              - double_vitrage
              - double_vitrage_fe
              - triple_vitrage
              - triple_vitrage_fe
              - null
          nature_lame:
            title: Nature de la lame d'air
            type:
              - string
              - 'null'
            x-enum: enveloppe:baie:nature-lame-air
            enum:
              - air
              - argon
              - krypton
              - null
          epaisseur_lame:
            title: Epaisseur de la lame d'air en mm
            oneOf:
              - $ref: /common#/$defs/nombre_positif
              - const: null
        required:
          - type
          - nature_lame
          - epaisseur_lame
        oneOf:
          - title: Vitrage simple
            properties:
              type:
                const: simple_vitrage
              nature_lame:
                $ref: /common#/$defs/non_applicable
              epaisseur_lame:
                $ref: /common#/$defs/non_applicable
            required:
              - type
              - nature_lame
              - epaisseur_lame
          - title: Vitrage complexe
            properties:
              type:
                enum:
                  - double_vitrage
                  - double_vitrage_fe
                  - triple_vitrage
                  - triple_vitrage_fe
            required:
              - type
          - title: Autres
            properties:
              type:
                enum:
                  - brique_verre
                  - polycarbonate
                  - null
              nature_lame:
                $ref: /common#/$defs/non_applicable
              epaisseur_lame:
                $ref: /common#/$defs/non_applicable
            required:
              - type
              - nature_lame
              - epaisseur_lame
      survitrage:
        title: Survitrage
        type: object
        additionalProperties: false
        properties:
          type:
            title: Type de survitrage
            type:
              - string
              - 'null'
            x-enum: enveloppe:baie:type-survitrage
            enum:
              - survitrage_simple
              - survitrage_fe
              - null
          epaisseur_lame:
            title: Epaisseur de la lame d'air en mm
            oneOf:
              - $ref: /common#/$defs/nombre_positif
              - const: null
        required:
          - type
          - epaisseur_lame
      data:
        title: Données calculées
        description: >
          En présence d'une double fenêtre (`position.baie_id` renseigné), les
          données de chaque baie sont calculées. Cependant, `sse` et `dp` sont
          divisées par 2 pour refléter la répartition des apports solaires et
          des déperditions entre les deux baies.
        type: object
        readOnly: true
        additionalProperties: false
        properties:
          sdep:
            title: Surface déperditive de la baie en m²
            type: number
          b:
            title: Coefficient de réduction des déperditions thermiques de la baie
            type: number
          dp:
            title: Déperditions thermiques de la baie en W/K
            type: number
          u:
            title: Coefficient de transmission thermique de la baie en W/(m².K)
            type: number
          deltar:
            title: Résistance thermique additionnelle de la baie en m².K/W
            type: number
          uw:
            title: >-
              Coefficient de transmission thermique de la baie avec double
              fenêtre en W/(m².K)
            type: number
          ug:
            title: Coefficient de transmission thermique du vitrage en W/(m².K)
            type: number
          sse:
            title: Surface sud équivalente de la baie en m²
            type: number
          sw:
            title: Facteur de transmission solaire de la baie
            type: number
          fe:
            title: Facteur d'ensoleillement de la baie
            type: number
        required:
          - sdep
          - b
          - dp
          - u
          - deltar
          - uw
          - ug
          - sse
          - sw
          - fe
    oneOf:
      - title: Baie en brique de verre
        type: object
        properties:
          type:
            enum:
              - brique_verre_pleine
              - brique_verre_creuse
          vitrage:
            type: object
            properties:
              type:
                const: brique_verre
          menuiserie:
            $ref: /common#/$defs/non_applicable
        required:
          - type
          - vitrage
          - menuiserie
      - title: Baie en polycarbonate
        type: object
        properties:
          type:
            const: polycarbonate
          vitrage:
            type: object
            properties:
              type:
                const: polycarbonate
            required:
              - type
        required:
          - type
          - vitrage
      - title: Fenêtre ou porte fenêtre
        type: object
        properties:
          type:
            enum:
              - fenetre_battante
              - fenetre_coulissante
              - porte_fenetre_coulissante
              - porte_fenetre_battante
          vitrage:
            type: object
            properties:
              type:
                not:
                  enum:
                    - brique_verre
                    - polycarbonate
            required:
              - type
          menuiserie:
            type: object
        required:
          - type
          - vitrage
          - menuiserie
