  https://schemas.open-dpe.fr/chauffage/generateur-base:
    $id: https://schemas.open-dpe.fr/chauffage/generateur-base
    title: Template - Générateur de chauffage
    type: object
    unevaluatedProperties: false
    properties:
      id:
        $ref: /common#/$defs/id
      description:
        $ref: /common#/$defs/description
      type:
        title: Type de générateur
        type:
          - string
          - 'null'
        x-enum: chauffage:type-generateur
        enum:
          - chaudiere
          - convecteur_bi_jonction
          - convecteur_electrique
          - panneau_rayonnant_electrique
          - plafond_rayonnant_electrique
          - plancher_rayonnant_electrique
          - radiateur_electrique
          - radiateur_electrique_accumulation
          - generateur_air_chaud
          - pac_air_air
          - pac_air_eau
          - pac_eau_eau
          - pac_eau_glycolee_eau
          - pac_geothermique
          - cuisiniere
          - foyer_ferme
          - insert
          - poele
          - poele_bouilleur
          - radiateur_gaz
          - reseau_chaleur
          - null
      energie:
        title: Energie
        type:
          - string
          - 'null'
        x-enum: energie
        enum:
          - electricite
          - gaz_naturel
          - gpl
          - fioul
          - charbon
          - bois_buche
          - bois_plaquette
          - bois_granule
          - reseau_chaleur
          - null
      bienergie:
        title: Energie secondaire
        x-enum: energie
        type:
          - string
          - 'null'
        enum:
          - gaz_naturel
          - gpl
          - fioul
          - null
      annee_installation:
        $ref: /common#/$defs/annee_installation
      position:
        title: Position
        type: object
        unevaluatedProperties: false
        properties:
          position_chaudiere:
            title: Position de la chaudière
            type:
              - string
              - 'null'
            x-enum: chauffage:position-chaudiere
            enum:
              - chaudiere_murale
              - chaudiere_sol
              - null
          cascade:
            title: Générateur en cascade
            description: >
              Ordre de priorité du générateur en cascade : - 0 : Absence de
              priorité - 1 : Générateur principal - 2 : Générateur secondaire
            type:
              - integer
              - 'null'
            enum:
              - 0
              - 1
              - 2
              - null
            default: null
          generateur_collectif:
            title: Générateur collectif d'eau chaude sanitaire
            type: boolean
          generateur_multi_batiment:
            title: Générateur multi bâtiment
            type: boolean
          position_volume_chauffe:
            title: Position du générateur à l'intérieur du volume chauffé
            type: boolean
          generateur_mixte_id:
            title: Identifiant du générateur mixte
            anyOf:
              - $ref: /common#/$defs/id
              - const: null
          reseau_chaleur_id:
            title: Identifiant du réseau de chaleur
            type:
              - string
              - 'null'
        required:
          - position_chaudiere
          - cascade
          - generateur_collectif
          - generateur_multi_batiment
          - position_volume_chauffe
          - generateur_mixte_id
          - reseau_chaleur_id
        anyOf:
          - title: Générateur individuel
            type: object
            properties:
              generateur_collectif:
                const: false
              generateur_multi_batiment:
                const: false
            required:
              - generateur_collectif
              - generateur_multi_batiment
          - title: Générateur collectif
            type: object
            properties:
              generateur_collectif:
                const: true
              position_volume_chauffe:
                const: false
            required:
              - generateur_collectif
              - position_volume_chauffe
      signaletique:
        title: Fiche signalétique
        type: object
        unevaluatedProperties: false
        properties:
          pn:
            title: Puissance nominale en kW
            oneOf:
              - $ref: /common#/$defs/nombre_positif
              - const: null
          label:
            title: Label du générateur
            type:
              - string
              - 'null'
            enum:
              - flamme_verte
              - nf_performance
              - null
            x-enum: chauffage:label-generateur
          scop:
            title: Coefficient de performance énergétique saisonnier
            oneOf:
              - $ref: /common#/$defs/nombre_positif
              - const: null
          mode_combustion:
            title: Mode de combustion
            type:
              - string
              - 'null'
            x-enum: chauffage:mode-combustion
            enum:
              - standard
              - basse_temperature
              - condensation
              - null
          presence_ventouse:
            title: Présence d'une ventouse
            type:
              - boolean
              - 'null'
          presence_regulation:
            title: Présence d'une régulation de combustion
            type:
              - boolean
              - 'null'
          pveilleuse:
            title: Puissance de la veilleuse en W
            oneOf:
              - $ref: /common#/$defs/nombre
              - const: null
          qp0:
            title: Pertes à l'arrêt en kW
            oneOf:
              - $ref: /common#/$defs/nombre_positif
              - const: null
          rpn:
            title: Rendement à puissance nominale sur PCI
            oneOf:
              - $ref: /common#/$defs/nombre_positif
              - const: null
          rpint:
            title: Rendement à puissance intermédiaire sur PCI
            oneOf:
              - $ref: /common#/$defs/nombre_positif
              - const: null
          tfonc30:
            title: Température de fonctionnement à 30% de la puissance nominale en °C
            oneOf:
              - $ref: /common#/$defs/nombre_positif
              - const: null
          tfonc100:
            title: >-
              Température de fonctionnement à 100% de la puissance nominale en
              °C
            oneOf:
              - $ref: /common#/$defs/nombre_positif
              - const: null
        required:
          - pn
          - label
          - scop
          - mode_combustion
          - presence_ventouse
          - presence_regulation
          - pveilleuse
          - qp0
          - rpn
          - rpint
          - tfonc30
          - tfonc100
      data:
        $ref: '#/$defs/data'
    required:
      - id
      - description
      - type
      - energie
      - bienergie
      - annee_installation
      - position
      - signaletique
