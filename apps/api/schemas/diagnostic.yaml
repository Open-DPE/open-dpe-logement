$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.open-dpe.fr/diagnostic
title: Diagnostic
type: object
additionalProperties: false
properties:
  id:
    $ref: /common#/$defs/id
    readOnly: true
  date:
    title: Date d'enregistrement
    $ref: /common#/$defs/date
    readOnly: true
  date_visite:
    title: Date de visite du logement
    $ref: /common#/$defs/date
  date_etablissement:
    title: Date d'établissement
    $ref: /common#/$defs/date
  type:
    title: Type de diagnostic
    type: string
    enum:
      - batiment
      - logement
    x-enum: type-diagnostic
  batiment:
    $ref: /batiment
  enveloppe:
    $ref: /enveloppe
  chauffage:
    $ref: /chauffage
  ecs:
    $ref: /ecs
  ventilation:
    $ref: /ventilation
  refroidissement:
    $ref: /refroidissement
  production:
    $ref: /production
  data:
    $ref: '#/$defs/data'
required:
  - date_visite
  - date_etablissement
  - batiment
  - enveloppe
  - chauffage
  - ecs
  - ventilation
  - refroidissement
  - production
oneOf:
  - title: Diagnostic bâtiment
    properties:
      type:
        const: batiment
      batiment:
        type: object
        properties:
          logement:
            $ref: /common#/$defs/non_applicable
        required:
          - logement
    required:
      - type
      - batiment
  - title: Diagnostic logement
    properties:
      type:
        const: logement
      batiment:
        type: object
        properties:
          logement:
            type: object
        required:
          - logement
    required:
      - type
      - batiment
$defs:
  data:
    title: Données calculées
    type: object
    readOnly: true
    additionalProperties: false
    properties:
      consommations:
        title: Consommations par usage et par énergie
        $ref: /common#/$defs/consommations
      cef:
        title: Consommation d'énergie finale en kWh/m².an
        type: number
      cep:
        title: Consommation d'énergie primaire en kWh/m².an
        type: number
      eges:
        title: Émissions de gaz à effet de serre en kgCO2/m².an
        type: number
      etiquette_energie:
        title: Étiquette énergie
        type: string
        enum:
          - A
          - B
          - C
          - D
          - E
          - F
          - G
        x-enum: etiquette
      etiquette_climat:
        title: Étiquette climat
        type: string
        enum:
          - A
          - B
          - C
          - D
          - E
          - F
          - G
        x-enum: etiquette
      confort_ete:
        title: Confort d'été
        type:
          - number
          - 'null'
        enum:
          - 1
          - 2
          - 3
          - null
        x-enum: confort-ete
    required:
      - consommations
      - cef
      - cep
      - eges
      - etiquette_energie
      - etiquette_climat
      - confort_ete
  https://schemas.open-dpe.fr/common:
    $id: https://schemas.open-dpe.fr/common
    $defs:
      non_applicable:
        title: Valeur non applicable
        type: 'null'
        const: null
        default: null
      id:
        title: Identifiant
        type: string
        format: uuid
      date:
        title: Date
        type: string
        format: date
      nombre:
        title: Nombre
        type: number
        multipleOf: 0.01
      nombre_positif:
        title: Nombre positif
        type: number
        multipleOf: 0.01
        exclusiveMinimum: 0
      annee:
        title: Année
        type: integer
        minimum: 1900
        maximum: 2026
      annee_construction:
        title: Année de construction
        anyOf:
          - $ref: '#/$defs/annee'
          - $ref: '#/$defs/non_applicable'
      annee_renovation:
        title: Année de dernière rénovation
        anyOf:
          - $ref: '#/$defs/annee'
          - $ref: '#/$defs/non_applicable'
      annee_installation:
        title: Année d'installation
        anyOf:
          - $ref: '#/$defs/annee'
          - $ref: '#/$defs/non_applicable'
      description:
        title: Description
        type: string
      surface:
        title: Surface exprimée en m²
        $ref: '#/$defs/nombre_positif'
      hauteur:
        title: Hauteur exprimée en m
        $ref: '#/$defs/nombre_positif'
      orientation:
        title: Orientation
        type: string
        x-enum: orientation
        enum:
          - nord
          - nord_est
          - est
          - sud_est
          - sud
          - sud_ouest
          - ouest
          - nord_ouest
      orientation_cardinale:
        title: Orientation cardinale
        type: string
        x-enum: orientation-cardinale
        enum:
          - nord
          - est
          - sud
          - ouest
      inclinaison:
        title: Inclinaison
        type: integer
        minimum: 0
        maximum: 90
      scenario:
        title: Scénario d'usage
        type: string
        x-enum: scenario
        enum:
          - conventionnel
          - depensier
      mois:
        title: Mois
        type: string
        x-enum: mois
        enum:
          - '01'
          - '02'
          - '03'
          - '04'
          - '05'
          - '06'
          - '07'
          - '08'
          - '09'
          - '10'
          - '11'
          - '12'
      usage:
        title: Usage
        type: string
        x-enum: usage
        enum:
          - chauffage
          - ecs
          - refroidissement
          - eclairage
          - auxiliaire
      energie:
        title: Energie
        type: string
        x-enum: energie
        enum:
          - electricite
          - electricite_renouvelable
          - gaz_naturel
          - gpl
          - fioul
          - charbon
          - bois_buche
          - bois_plaquette
          - bois_granule
          - reseau_chaleur
          - reseau_froid
      adresse:
        title: Adresse
        type: object
        additionalProperties: false
        properties:
          ban_id:
            title: Identifiant depuis la Base Adresse Nationale (BAN)
            description: >-
              Clé d'interopérabilité telle que définie dans la spécification du
              format d'échange BAL
            type:
              - string
              - 'null'
          nom:
            title: Numéro éventuel et nom de voie ou lieu dit
            type: string
          code_postal:
            title: Code postal de la commune
            type: string
          code_insee:
            title: Code INSEE de la commune
            type: string
          commune:
            title: Nom officiel de la commune
            type: string
        required:
          - ban_id
          - nom
          - code_postal
          - code_insee
          - commune
      consommations:
        title: Consommations par usage et par énergie
        type: object
        propertyNames:
          $ref: '#/$defs/usage'
        additionalProperties:
          type: object
          propertyNames:
            $ref: '#/$defs/energie'
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              cef:
                type: number
              cep:
                type: number
              eges:
                type: number
            required:
              - cef
              - cep
              - eges
  https://schemas.open-dpe.fr/batiment:
    $id: https://schemas.open-dpe.fr/batiment
    title: Bâtiment
    type: object
    unevaluatedProperties: false
    properties:
      rnb_id:
        title: Identifiant du bâtiment depuis le RNB
        type:
          - string
          - 'null'
      type:
        title: Type de bâtiment
        type: string
        enum:
          - maison
          - immeuble
        x-enum: type-batiment
      annee_construction:
        title: Année de construction
        $ref: /common#/$defs/annee
      annee_renovation:
        $ref: /common#/$defs/annee_renovation
      altitude:
        title: Altitude du bâtiment en mètres
        type: integer
        minimum: -1000
        maximum: 10000
      logements:
        title: Nombre de logements
        type: integer
        exclusiveMinimum: 0
      surface_habitable:
        title: Surface habitable en m²
        $ref: /common#/$defs/surface
      hauteur_sous_plafond:
        title: Hauteur moyenne sous plafond en m
        $ref: /common#/$defs/hauteur
      materiaux_anciens:
        title: Bâtiment majoritairement composé de matériaux anciens
        type: boolean
      adresse:
        $ref: /common#/$defs/adresse
      appartements_visites:
        title: Appartements visités
        type: array
        items:
          $ref: /batiment/appartement
      logement:
        oneOf:
          - $ref: '#/$defs/logement'
          - $ref: /common#/$defs/non_applicable
      data:
        $ref: '#/$defs/data'
    required:
      - rnb_id
      - type
      - annee_construction
      - annee_renovation
      - altitude
      - logements
      - surface_habitable
      - hauteur_sous_plafond
      - materiaux_anciens
      - adresse
      - appartements_visites
      - logement
    oneOf:
      - title: Maison individuelle
        properties:
          type:
            const: maison
          logements:
            enum:
              - 1
              - 2
          appartements_visites:
            const: []
        required:
          - type
          - logements
          - appartements_visites
      - title: Immeuble - Bâtiment
        properties:
          type:
            const: immeuble
          logements:
            type: integer
            minimum: 3
          appartements_visites:
            type: array
            minItems: 1
        required:
          - type
          - logements
          - appartements_visites
    $defs:
      logement:
        title: Logement de référence
        type: object
        additionalProperties: false
        properties:
          description:
            $ref: /common#/$defs/description
          surface_habitable:
            title: Surface habitable en m²
            $ref: /common#/$defs/surface
          hauteur_sous_plafond:
            title: Hauteur sous plafond moyenne en m
            $ref: /common#/$defs/hauteur
        required:
          - description
          - surface_habitable
          - hauteur_sous_plafond
      data:
        title: Données calculées
        type: object
        readOnly: true
        additionalProperties: false
        properties:
          zone_climatique:
            title: Zone climatique
            type: string
            x-enum: zone-climatique
          sh:
            title: Surface habitable de référence en m²
            type: number
          hsp:
            title: Hauteur sous plafond de référence en m
            type: number
          ratio_proratisation:
            title: Ratio de proratisation
            type: number
        required:
          - zone_climatique
          - sh
          - hsp
          - ratio_proratisation
  https://schemas.open-dpe.fr/batiment/appartement:
    $id: https://schemas.open-dpe.fr/batiment/appartement
    title: Appartement visité
    type: object
    additionalProperties: false
    properties:
      id:
        $ref: /common#/$defs/id
      description:
        $ref: /common#/$defs/description
      surface_habitable:
        title: Surface habitable en m²
        $ref: /common#/$defs/surface
      hauteur_sous_plafond:
        title: Hauteur sous plafond moyenne en m
        $ref: /common#/$defs/hauteur
      position:
        title: Position de l'appartement dans le bâtiment
        type: string
        x-enum: batiment:position-appartement
        enum:
          - rdc
          - etage_intermediaire
          - dernier_etage
      typologie:
        title: Typologie d'appartement
        type: string
        x-enum: batiment:typologie-appartement
        enum:
          - T1
          - T2
          - T3
          - T4
          - T5
          - T6
          - T7
    required:
      - id
      - description
      - surface_habitable
      - hauteur_sous_plafond
      - position
      - typologie
  https://schemas.open-dpe.fr/enveloppe:
    $id: https://schemas.open-dpe.fr/enveloppe
    title: Enveloppe
    type: object
    additionalProperties: false
    properties:
      exposition:
        title: Exposition
        type: string
        x-enum: enveloppe:exposition
        enum:
          - simple
          - multiple
      q4pa_conv:
        title: Débit d'air conventionnel à 4 Pa en m³/h
        oneOf:
          - $ref: /common#/$defs/nombre_positif
          - const: null
      presence_brasseurs_air:
        title: Présence de brasseurs d'air
        type: boolean
      niveaux:
        title: Liste des niveaux
        type: array
        minItems: 1
        items:
          $ref: /enveloppe/niveau
      locaux_non_chauffes:
        title: Liste des locaux non chauffés
        type: array
        items:
          $ref: /enveloppe/local-non-chauffe
      murs:
        title: Liste des murs
        type: array
        items:
          $ref: /enveloppe/mur
      planchers_bas:
        title: Liste des planchers bas
        type: array
        items:
          $ref: /enveloppe/plancher-bas
      planchers_hauts:
        title: Liste des planchers hauts
        type: array
        items:
          $ref: /enveloppe/plancher-haut
      baies:
        title: Liste des baies
        type: array
        items:
          $ref: /enveloppe/baie
      portes:
        title: Liste des portes
        type: array
        items:
          $ref: /enveloppe/porte
      ponts_thermiques:
        title: Liste des ponts thermiques
        type: array
        items:
          $ref: /enveloppe/pont-thermique
      data:
        $ref: '#/$defs/data'
    required:
      - exposition
      - q4pa_conv
      - presence_brasseurs_air
      - niveaux
      - locaux_non_chauffes
      - murs
      - planchers_bas
      - planchers_hauts
      - baies
      - portes
      - ponts_thermiques
    $defs:
      data:
        title: Données calculées
        type: object
        readOnly: true
        additionalProperties: false
        properties:
          gv:
            title: Coefficient de déperditions globales en W/K
            type: number
          ubat:
            title: >-
              Coefficient de transmission surfacique moyen du bâtiment en
              W/(m².K)
            type: number
          dp:
            title: Déperditions par parois en W/K
            type: number
          dp_murs:
            title: Déperditions par les murs en W/K
            type: number
          dp_planchers_bas:
            title: Déperditions par les planchers bas en W/K
            type: number
          dp_planchers_hauts:
            title: Déperditions par les planchers hauts en W/K
            type: number
          dp_baies:
            title: Déperditions par les baies en W/K
            type: number
          dp_portes:
            title: Déperditions par les portes en W/K
            type: number
          pt:
            title: Déperditions thermiques par les ponts thermiques en W/K
            type: number
          dr:
            title: Déperditions thermiques par renouvellement d'air en W/K
            type: number
          sdep:
            title: Surface déperditive totale en m²
            type: number
          sdep_murs:
            title: Surface déperditive des murs en m²
            type: number
          sdep_planchers_bas:
            title: Surface déperditive des planchers bas en m²
            type: number
          sdep_planchers_hauts:
            title: Surface déperditive des planchers hauts en m²
            type: number
          sdep_baies:
            title: Surface déperditive des baies en m²
            type: number
          sdep_portes:
            title: Surface déperditive des portes en m²
            type: number
          inertie:
            title: Classe d'inertie thermique du bâtiment
            type: string
            x-enum: enveloppe:inertie
          hperm:
            title: >-
              Déperditions thermiques par renouvellement d'air due au vent en
              W/K
            type: number
          hvent:
            title: >-
              Déperditions thermiques par renouvellement d'air due aux systèmes
              de ventilation en W/K
            type: number
          q4pa_conv:
            title: Débit d'air conventionnel à 4 Pa en m³/h
            type: number
          presence_joints:
            title: >-
              Présence majoritaire de joints d'étanchéité au niveau des
              menuiseries extérieures
            type: boolean
          isolation_planchers_hauts:
            title: Isolation majoritaire des planchers hauts
            type: boolean
          presence_protection_solaire:
            title: Présence majoritaire de protections solaires
            type: boolean
          logement_traversant:
            title: Logement traversant
            type: boolean
          sse:
            title: Surface sud équivalente totale en m²
            type: number
        required:
          - gv
          - ubat
          - dp
          - dp_murs
          - dp_planchers_bas
          - dp_planchers_hauts
          - dp_baies
          - dp_portes
          - pt
          - dr
          - sdep
          - sdep_murs
          - sdep_planchers_bas
          - sdep_planchers_hauts
          - sdep_baies
          - sdep_portes
          - inertie
          - hperm
          - hvent
          - presence_joints
          - isolation_planchers_hauts
          - presence_protection_solaire
          - logement_traversant
          - sse
  https://schemas.open-dpe.fr/enveloppe/niveau:
    $id: https://schemas.open-dpe.fr/enveloppe/niveau
    title: Niveau
    type: object
    additionalProperties: false
    properties:
      id:
        $ref: /common#/$defs/id
      description:
        $ref: /common#/$defs/description
      surface:
        $ref: /common#/$defs/surface
      inertie_paroi_verticale:
        title: Inertie des parois verticales
        $ref: /enveloppe/paroi#/$defs/inertie
      inertie_plancher_bas:
        title: Inertie des planchers bas
        $ref: /enveloppe/paroi#/$defs/inertie
      inertie_plancher_haut:
        title: Inertie des planchers hauts
        $ref: /enveloppe/paroi#/$defs/inertie
      data:
        $ref: '#/$defs/data'
    required:
      - id
      - description
      - surface
      - inertie_paroi_verticale
      - inertie_plancher_bas
      - inertie_plancher_haut
    $defs:
      data:
        title: Données calculées
        type: object
        readOnly: true
        additionalProperties: false
        properties:
          inertie:
            title: Classe d'inertie thermique du niveau
            type: string
            x-enum: enveloppe:inertie
        required:
          - inertie
  https://schemas.open-dpe.fr/enveloppe/paroi:
    $id: https://schemas.open-dpe.fr/enveloppe/paroi
    title: Paroi
    type: object
    $defs:
      inertie:
        title: Inertie de la paroi
        type:
          - string
          - 'null'
        x-enum: enveloppe:paroi:inertie
        enum:
          - lourde
          - legere
          - null
      mitoyennete:
        title: Mitoyenneté
        type: string
        x-enum: enveloppe:paroi:mitoyennete
        enum:
          - exterieur
          - enterre
          - vide_sanitaire
          - terre_plein
          - sous_sol_non_chauffe
          - local_non_chauffe
          - local_non_residentiel
          - local_residentiel
          - local_non_accessible
      orientation:
        title: Orientation
        type: string
        x-enum: enveloppe:paroi:orientation
        oneOf:
          - $ref: /common#/$defs/orientation_cardinale
          - const: horizontale
      type_pose:
        title: Type de pose
        type: string
        x-enum: enveloppe:paroi:type-pose
        enum:
          - nu_exterieur
          - nu_interieur
          - tunnel
      type_isolation:
        title: Type d'isolation
        type: string
        x-enum: enveloppe:paroi:type-isolation
        enum:
          - iti
          - ite
          - itr
          - iti_ite
          - itr_iti
          - itr_ite
          - itr_iti_ite
      position:
        title: Position
        type: object
        properties:
          surface:
            $ref: /common#/$defs/surface
          mitoyennete:
            $ref: '#/$defs/mitoyennete'
          local_non_chauffe_id:
            title: Identifiant du local non chauffé associé à la paroi
            anyOf:
              - $ref: /common#/$defs/id
              - const: null
        required:
          - surface
          - mitoyennete
        oneOf:
          - title: Paroi donnant sur un local non chauffé
            type: object
            properties:
              mitoyennete:
                const: local_non_chauffe
              local_non_chauffe_id:
                type: string
            required:
              - mitoyennete
              - local_non_chauffe_id
          - title: Autres cas
            type: object
            properties:
              mitoyennete:
                enum:
                  - exterieur
                  - enterre
                  - vide_sanitaire
                  - terre_plein
                  - sous_sol_non_chauffe
                  - local_non_residentiel
                  - local_residentiel
                  - local_non_accessible
              local_non_chauffe_id:
                $ref: /common#/$defs/non_applicable
            required:
              - mitoyennete
              - local_non_chauffe_id
      isolation:
        title: Isolation
        type: object
        unevaluatedProperties: false
        properties:
          etat:
            title: Etat d'isolation
            type:
              - boolean
              - 'null'
          type:
            title: Type d'isolation
            anyOf:
              - $ref: '#/$defs/type_isolation'
              - const: null
          annee_installation:
            $ref: /common#/$defs/annee_installation
          epaisseur:
            title: Epaisseur de l'isolation en mm
            oneOf:
              - $ref: /common#/$defs/nombre_positif
              - const: null
          resistance_thermique:
            title: Résistance thermique de l'isolation en m².K/W
            oneOf:
              - $ref: /common#/$defs/nombre_positif
              - const: null
        required:
          - etat
        oneOf:
          - title: Paroi non isolée ou dont l'isolation n'est pas connue
            type: object
            properties:
              etat:
                enum:
                  - false
                  - null
              type:
                $ref: /common#/$defs/non_applicable
              annee_installation:
                $ref: /common#/$defs/non_applicable
              epaisseur:
                $ref: /common#/$defs/non_applicable
              resistance_thermique:
                $ref: /common#/$defs/non_applicable
            required:
              - etat
              - type
              - annee_installation
              - epaisseur
              - resistance_thermique
          - title: Paroi isolée mais dont le type d'isolation n'est pas connu
            type: object
            properties:
              etat:
                const: true
              type:
                $ref: /common#/$defs/non_applicable
              annee_installation:
                $ref: /common#/$defs/non_applicable
              epaisseur:
                $ref: /common#/$defs/non_applicable
              resistance_thermique:
                $ref: /common#/$defs/non_applicable
            required:
              - etat
              - type
              - annee_installation
              - epaisseur
              - resistance_thermique
          - title: Paroi isolée
            type: object
            properties:
              etat:
                const: true
              type:
                type: string
            required:
              - etat
              - type
              - annee_installation
              - epaisseur
              - resistance_thermique
  https://schemas.open-dpe.fr/enveloppe/local-non-chauffe:
    $id: https://schemas.open-dpe.fr/enveloppe/local-non-chauffe
    title: Local non chauffé
    type: object
    unevaluatedProperties: false
    properties:
      id:
        $ref: /common#/$defs/id
      description:
