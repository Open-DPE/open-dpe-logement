climat.zone_climatique:
  id: climat.zone_climatique
  description: Zone climatique du bâtiment
  type: string

climat.tbase:
  id: climat.tbase
  description: Température extérieure de base
  type: number
  unite: °C
  dependances:
    - climat.zone_climatique

climat.nj:
  id: climat.nj
  description: Nombre de jours
  type: number
  unite: jours/mois

climat.epv:
  id: climat.epv
  description: Ensoleillement potentiel
  type: number
  unite: kWh/m²/mois
  dependances:
    - climat.zone_climatique
    - enveloppe.inertie
    - enveloppe.parois_anciennes

climat.sollicitations:
  id: climat.sollicitations
  description: Sollicitations climatiques pour chaque mois de l'année
  dependances:
    - climat.zone_climatique
    - enveloppe.inertie
    - enveloppe.parois_anciennes
