refroidissement.cfr:
  id: refroidissement.cfr
  description: Consommations de refroidissement
  type: number
  unite: kWh/an
  dependances:
    - refroidissement.generateur.cfr

refroidissement.cfr_elec:
  id: refroidissement.cfr_elec
  description: Consommations électriques de refroidissement
  type: number
  unite: kWh/an
  dependances:
    - refroidissement.generateur.cfr

refroidissement.caux:
  id: refroidissement.caux
  description: Consommations des auxiliaires de refroidissement
  type: number
  unite: kWh/an
  dependances:
    - refroidissement.generateur.caux

refroidissement.bfr:
  id: refroidissement.bfr
  description: Besoins de refroidissement
  type: number
  unite: kWh/mois
  dependances:
    - enveloppe.gv
    - refroidissement.tint
    - refroidissement.as
    - refroidissement.ai
    - refroidissement.fut
    - refroidissement.rbth
    - refroidissement.nref
    - refroidissement.textmoy

refroidissement.fut:
  id: refroidissement.fut
  description: Facteur d'utilisation des apports gratuits
  type: number
  dependances:
    - refroidissement.rbth
    - refroidissement.t

refroidissement.rbth:
  id: refroidissement.rbth
  description: Ratio de bilan thermique
  type: number
  dependances:
    - enveloppe.gv
    - refroidissement.as
    - refroidissement.ai
    - refroidissement.nref
    - refroidissement.textmoy
    - refroidissement.cin

refroidissement.as:
  id: refroidissement.as
  description: Apports solaires
  type: number
  unite: Wh/mois
  dependances:
    - enveloppe.sse
    - refroidissement.e

refroidissement.ai:
  id: refroidissement.ai
  description: Apports internes
  type: number
  unite: Wh/mois
  dependances:
    - batiment.sh
    - ecs.nadeq
    - refroidissement.nref

refroidissement.e:
  id: refroidissement.e
  description: Ensoleillement reçu en période de refroidissement
  type: number
  unite: kWh/m²/mois
  dependances:
    - climat.sollicitations

refroidissement.textmoy:
  id: refroidissement.textmoy
  description: Température extérieure moyenne
  type: number
  unite: °C
  dependances:
    - climat.sollicitations

refroidissement.nref:
  id: refroidissement.nref
  description: Nombre d'heures de refroidissement
  type: number
  unite: h/mois
  dependances:
    - climat.sollicitations

refroidissement.tint:
  id: refroidissement.tint
  description: Température de consigne en froid
  type: number
  unite: °C

refroidissement.t:
  id: refroidissement.t
  description: Constante de temps de la zone pour le refroidissement
  type: number
  unite: h
  dependances:
    - enveloppe.gv
    - refroidissement.cin

refroidissement.cin:
  id: refroidissement.cin
  description: Capacité thermique intérieure efficace de la zone
  type: number
  unite: J/K
  dependances:
    - batiment.sh
    - enveloppe.inertie

# <-- Installations de refroidissement -->

refroidissement.installation.rdim:
  id: refroidissement.installation.rdim
  description: Ratio de dimensionnement de l'installation de refroidissement
  type: number

# <-- Générateurs de refroidissement -->

refroidissement.generateur.cfr:
  id: refroidissement.generateur.cfr
  description: Consommations de refroidissement du générateur de refroidissement
  type: number
  unite: kWh/an
  dependances:
    - refroidissement.bfr
    - refroidissement.generateur.rdim
    - refroidissement.generateur.eer

refroidissement.generateur.caux:
  id: refroidissement.generateur.caux
  description: Consommations de l'auxiliaire de refroidissement
  type: number
  unite: kWh/an

refroidissement.generateur.rdim:
  id: refroidissement.generateur.rdim
  description: Ratio de dimensionnement du générateur de refroidissement
  type: number
  dependances:
    - refroidissement.installation.rdim

refroidissement.generateur.eer:
  id: refroidissement.generateur.eer
  description: Efficacité énergétique du générateur de refroidissement
  type: number
  dependances:
    - climat.zone_climatique
