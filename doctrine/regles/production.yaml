production.ppv:
  id: production.ppv
  description: Production d'électricité photovoltaique
  type: number
  unite: kWh/an
  dependances:
    - production.panneau_photovoltaique.ppv

production.celec_ac:
  id: production.celec_ac
  description: Électricité photovoltaïque autoconsommée
