    - production.celec_autres

production.tapl:
  id: production.tapl
  description: Coefficient de calage représentant le taux d'auto-production maximum pouvant être atteint lorsque la production d'électricité renouvelable augmente
  type: number
  dependances:
    - production.celec_ch
    - production.celec_ecs
    - production.celec_fr
    - production.celec_ecl
    - production.celec_aux_dist
    - production.celec_aux_vent
